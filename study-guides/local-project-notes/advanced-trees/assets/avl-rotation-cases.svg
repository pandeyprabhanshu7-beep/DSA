<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
  <title id="title">AVL rotation cases</title>
  <desc id="desc">Four compact panels show LL, RR, LR and RL heavy paths and the balanced three-key result.</desc>
  <style>
    .panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.edge{stroke:#475569;stroke-width:3}.heavy{stroke:#dc2626;stroke-width:6}.node{fill:#1e3a5f;stroke:#0f172a;stroke-width:2}.key{font:700 17px system-ui;fill:white;text-anchor:middle;dominant-baseline:central}.heading{font:700 22px system-ui;fill:#0f172a}.small{font:16px system-ui;fill:#334155}.arrow{font:700 28px system-ui;fill:#2563eb}
  </style>
  <rect class="panel" x="20" y="20" width="490" height="290" rx="16"/><rect class="panel" x="530" y="20" width="490" height="290" rx="16"/>
  <rect class="panel" x="20" y="330" width="490" height="300" rx="16"/><rect class="panel" x="530" y="330" width="490" height="300" rx="16"/>
  <text class="heading" x="40" y="55">LL → rotate right</text><text class="small" x="40" y="80">30 ← 20 ← 10</text>
  <line class="heavy" x1="135" y1="120" x2="95" y2="180"/><line class="heavy" x1="95" y1="200" x2="65" y2="250"/><circle class="node" cx="140" cy="110" r="27"/><text class="key" x="140" y="110">30</text><circle class="node" cx="90" cy="190" r="27"/><text class="key" x="90" y="190">20</text><circle class="node" cx="60" cy="265" r="27"/><text class="key" x="60" y="265">10</text><text class="arrow" x="230" y="185">→</text>
  <line class="edge" x1="360" y1="135" x2="315" y2="215"/><line class="edge" x1="360" y1="135" x2="405" y2="215"/><circle class="node" cx="360" cy="120" r="27"/><text class="key" x="360" y="120">20</text><circle class="node" cx="310" cy="230" r="27"/><text class="key" x="310" y="230">10</text><circle class="node" cx="410" cy="230" r="27"/><text class="key" x="410" y="230">30</text>
  <text class="heading" x="550" y="55">RR → rotate left</text><text class="small" x="550" y="80">10 → 20 → 30</text>
  <line class="heavy" x1="650" y1="120" x2="695" y2="180"/><line class="heavy" x1="695" y1="200" x2="730" y2="250"/><circle class="node" cx="645" cy="110" r="27"/><text class="key" x="645" y="110">10</text><circle class="node" cx="700" cy="190" r="27"/><text class="key" x="700" y="190">20</text><circle class="node" cx="735" cy="265" r="27"/><text class="key" x="735" y="265">30</text><text class="arrow" x="785" y="185">→</text>
  <line class="edge" x1="905" y1="135" x2="860" y2="215"/><line class="edge" x1="905" y1="135" x2="950" y2="215"/><circle class="node" cx="905" cy="120" r="27"/><text class="key" x="905" y="120">20</text><circle class="node" cx="855" cy="230" r="27"/><text class="key" x="855" y="230">10</text><circle class="node" cx="955" cy="230" r="27"/><text class="key" x="955" y="230">30</text>
  <text class="heading" x="40" y="365">LR → child left, parent right</text><text class="small" x="40" y="390">30 ← 10 → 20</text>
  <line class="heavy" x1="135" y1="430" x2="85" y2="495"/><line class="heavy" x1="90" y1="515" x2="145" y2="570"/><circle class="node" cx="140" cy="420" r="27"/><text class="key" x="140" y="420">30</text><circle class="node" cx="80" cy="505" r="27"/><text class="key" x="80" y="505">10</text><circle class="node" cx="150" cy="580" r="27"/><text class="key" x="150" y="580">20</text><text class="arrow" x="230" y="505">→</text>
  <line class="edge" x1="360" y1="455" x2="315" y2="535"/><line class="edge" x1="360" y1="455" x2="405" y2="535"/><circle class="node" cx="360" cy="440" r="27"/><text class="key" x="360" y="440">20</text><circle class="node" cx="310" cy="550" r="27"/><text class="key" x="310" y="550">10</text><circle class="node" cx="410" cy="550" r="27"/><text class="key" x="410" y="550">30</text>
  <text class="heading" x="550" y="365">RL → child right, parent left</text><text class="small" x="550" y="390">10 → 30 ← 20</text>
  <line class="heavy" x1="650" y1="430" x2="710" y2="495"/><line class="heavy" x1="710" y1="515" x2="660" y2="570"/><circle class="node" cx="645" cy="420" r="27"/><text class="key" x="645" y="420">10</text><circle class="node" cx="715" cy="505" r="27"/><text class="key" x="715" y="505">30</text><circle class="node" cx="655" cy="580" r="27"/><text class="key" x="655" y="580">20</text><text class="arrow" x="785" y="505">→</text>
  <line class="edge" x1="905" y1="455" x2="860" y2="535"/><line class="edge" x1="905" y1="455" x2="950" y2="535"/><circle class="node" cx="905" cy="440" r="27"/><text class="key" x="905" y="440">20</text><circle class="node" cx="855" cy="550" r="27"/><text class="key" x="855" y="550">10</text><circle class="node" cx="955" cy="550" r="27"/><text class="key" x="955" y="550">30</text>
</svg>
