<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">B plus tree point routing and linked leaf range scan</title>
  <desc id="desc">A root with separators 18 and 44 routes to three ordered leaves. A blue path searches for 24. A green path scans from 12 through 31 using next-leaf links and stops before 44.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#15803d"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}.label{font-size:20px;font-weight:700}.small{font-size:16px}.node{fill:#fff;stroke:#334155;stroke-width:3}.leaf{fill:#f8fafc;stroke:#334155;stroke-width:3}.key{fill:#e2e8f0;stroke:#64748b}.route{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.point{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#blueArrow)}.scan{fill:none;stroke:#15803d;stroke-width:5;marker-end:url(#greenArrow)}
    </style>
  </defs>
  <rect width="1000" height="540" rx="18" fill="#f1f5f9"/>
  <text x="40" y="42" class="label">Internal separators route; linked leaves answer</text>
  <rect x="400" y="75" width="200" height="72" rx="12" class="node"/>
  <line x1="500" y1="75" x2="500" y2="147" stroke="#64748b" stroke-width="2"/>
  <text x="452" y="120" class="label">18</text><text x="548" y="120" class="label">44</text>
  <text x="420" y="67" class="small">root page</text>

  <path d="M430 147 C390 185 255 198 215 245" class="route"/>
  <path d="M500 147 L500 245" class="point"/>
  <path d="M570 147 C610 185 745 198 785 245" class="route"/>

  <g transform="translate(70,250)">
    <rect width="270" height="95" rx="12" class="leaf"/>
    <rect x="18" y="28" width="70" height="44" rx="7" class="key"/><rect x="100" y="28" width="70" height="44" rx="7" class="key"/><rect x="182" y="28" width="70" height="44" rx="7" class="key"/>
    <text x="48" y="58" class="label">5</text><text x="126" y="58" class="label">9</text><text x="204" y="58" class="label">12</text>
  </g>
  <g transform="translate(365,250)">
    <rect width="270" height="95" rx="12" class="leaf"/>
    <rect x="18" y="28" width="70" height="44" rx="7" class="key"/><rect x="100" y="28" width="70" height="44" rx="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><rect x="182" y="28" width="70" height="44" rx="7" class="key"/>
    <text x="40" y="58" class="label">18</text><text x="122" y="58" class="label">24</text><text x="204" y="58" class="label">31</text>
  </g>
  <g transform="translate(660,250)">
    <rect width="270" height="95" rx="12" class="leaf"/>
    <rect x="38" y="28" width="82" height="44" rx="7" class="key"/><rect x="150" y="28" width="82" height="44" rx="7" class="key"/>
    <text x="62" y="58" class="label">44</text><text x="174" y="58" class="label">52</text>
  </g>

  <path d="M340 298 L365 298" class="scan"/><path d="M635 298 L660 298" class="scan"/>
  <text x="175" y="382" class="small" fill="#15803d">range [10,40]: start at 12</text>
  <path d="M225 355 C275 430 560 430 610 355" class="scan"/>
  <line x1="660" y1="370" x2="660" y2="455" stroke="#dc2626" stroke-width="5"/>
  <text x="680" y="420" class="small" fill="#dc2626">stop: 44 &gt; 40</text>
  <text x="400" y="490" class="small" fill="#2563eb">point lookup 24: equality with separator routes right, then leaf confirms</text>
  <text x="62" y="520" class="small">Separator convention: each separator is the minimum key in its right child subtree.</text>
</svg>
