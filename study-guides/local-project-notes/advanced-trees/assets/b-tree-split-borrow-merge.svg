<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">B-tree split, borrow and merge transformations</title>
  <desc id="desc">Three panels show a full child split with median promotion, a key borrowed through the parent, and two minimal children merged with a parent separator.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:15px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.node{fill:#f8fafc;stroke:#334155;stroke-width:3}.hot{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.move{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}.muted{fill:none;stroke:#64748b;stroke-width:2}
    </style>
  </defs>
  <rect width="1100" height="720" rx="20" fill="#f1f5f9"/>
  <text x="36" y="42" class="title">B-tree repairs preserve order and occupancy</text>

  <rect x="30" y="65" width="1040" height="195" rx="15" class="panel"/>
  <text x="50" y="96" class="title">1. Split full child (`t=3`)</text>
  <rect x="75" y="130" width="300" height="58" rx="10" class="node"/>
  <text x="106" y="166" class="label">5 | 10 | 12 | 20 | 30</text>
  <path d="M390 160 L500 160" class="move"/>
  <rect x="545" y="105" width="90" height="52" rx="9" class="hot"/><text x="577" y="138" class="label">12</text>
  <rect x="465" y="190" width="150" height="50" rx="9" class="node"/><text x="500" y="222" class="label">5 | 10</text>
  <rect x="660" y="190" width="150" height="50" rx="9" class="node"/><text x="692" y="222" class="label">20 | 30</text>
  <path d="M580 157 L550 190" class="muted"/><path d="M600 157 L735 190" class="muted"/>
  <text x="835" y="205" class="small">median moves to parent</text><text x="835" y="228" class="small">both children have `t-1` keys</text>

  <rect x="30" y="280" width="1040" height="195" rx="15" class="panel"/>
  <text x="50" y="312" class="title">2. Borrow through parent (`t=2`)</text>
  <rect x="430" y="325" width="220" height="52" rx="9" class="node"/><text x="475" y="358" class="label">10 | 20</text>
  <rect x="170" y="400" width="190" height="52" rx="9" class="node"/><text x="215" y="433" class="label">2 | 5 | 7</text>
  <rect x="455" y="400" width="150" height="52" rx="9" class="hot"/><text x="515" y="433" class="label">12</text>
  <path d="M330 400 C355 360 410 352 455 352" class="move"/>
  <text x="330" y="380" class="small">7 up</text>
  <path d="M482 377 L482 400" class="move"/><text x="492" y="393" class="small">10 down</text>
  <text x="690" y="410" class="label">result: root `[7 | 20]`</text>
  <text x="690" y="440" class="label">target `[10 | 12]`, then delete 12</text>

  <rect x="30" y="495" width="1040" height="195" rx="15" class="panel"/>
  <text x="50" y="527" class="title">3. Merge minimal children (`t=2`)</text>
  <rect x="430" y="540" width="220" height="52" rx="9" class="node"/><text x="478" y="573" class="label">7 | 20</text>
  <rect x="280" y="620" width="80" height="48" rx="9" class="node"/><text x="309" y="651" class="label">2</text>
  <rect x="455" y="620" width="80" height="48" rx="9" class="hot"/><text x="478" y="651" class="label">10</text>
  <rect x="630" y="620" width="80" height="48" rx="9" class="node"/><text x="652" y="651" class="label">22</text>
  <path d="M575 592 L545 620" class="move"/><text x="565" y="615" class="small">20</text>
  <path d="M630 644 L545 644" class="move"/>
  <text x="765" y="622" class="label">merge `[10] + 20 + [22]`</text>
  <text x="765" y="653" class="label">then delete inside `[10,20,22]`</text>
  <text x="40" y="708" class="small">Internal keys are real entries in this classical B-tree model; arrows show key movement, not database locking or WAL order.</text>
</svg>
