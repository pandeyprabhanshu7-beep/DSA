<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">Home Wi-Fi packet path</title><desc id="desc">Laptop: 192.168.1.20:51514 sends to server port 443.; Home router: PAT maps the private source to a WAN address/port.; ISP routers: Forward toward the destination prefix.; HTTPS server: Replies to the translated source; NAT reverses mapping.</desc><rect width="900" height="580" rx="24" fill="#0f172a"/><text x="36" y="52" fill="#f8fafc" font-family="sans-serif" font-size="27">Home Wi-Fi packet path</text><rect x="36" y="82" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="113" fill="#7dd3fc" font-family="sans-serif" font-size="22">1. Laptop</text><text x="56" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="17">192.168.1.20:51514 sends to server port 443.</text><path d="M450 176 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="199" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="22">2. Home router</text><text x="56" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="17">PAT maps the private source to a WAN address/port.</text><path d="M450 293 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="316" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="22">3. ISP routers</text><text x="56" y="375" fill="#e2e8f0" font-family="sans-serif" font-size="17">Forward toward the destination prefix.</text><path d="M450 410 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="433" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="464" fill="#7dd3fc" font-family="sans-serif" font-size="22">4. HTTPS server</text><text x="56" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="17">Replies to the translated source; NAT reverses mapping.</text></svg>