<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">From laptop to AWS</title><desc id="desc">Name and address: DNS resolves a name; IP identifies a destination.; Local network: Wi-Fi/Ethernet delivers a frame to the next hop.; Interconnected networks: Routers forward by prefix across independent networks.; Application service: Transport, TLS and HTTP complete the request.</desc><rect width="900" height="580" rx="24" fill="#0f172a"/><text x="36" y="52" fill="#f8fafc" font-family="sans-serif" font-size="27">From laptop to AWS</text><rect x="36" y="82" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="113" fill="#7dd3fc" font-family="sans-serif" font-size="22">1. Name and address</text><text x="56" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="17">DNS resolves a name; IP identifies a destination.</text><path d="M450 176 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="199" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="22">2. Local network</text><text x="56" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="17">Wi-Fi/Ethernet delivers a frame to the next hop.</text><path d="M450 293 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="316" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="22">3. Interconnected networks</text><text x="56" y="375" fill="#e2e8f0" font-family="sans-serif" font-size="17">Routers forward by prefix across independent networks.</text><path d="M450 410 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="433" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="464" fill="#7dd3fc" font-family="sans-serif" font-size="22">4. Application service</text><text x="56" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="17">Transport, TLS and HTTP complete the request.</text></svg>