<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">Prove the failed layer</title><desc id="desc">Name and destination: Check DNS result, IP family and intended endpoint.; Reachability and policy: Inspect route associations, SG and both NACL directions.; Transport and encryption: Test listener, TCP/QUIC handshake and TLS certificate.; Application evidence: Inspect health checks, access logs and request errors.</desc><rect width="900" height="580" rx="24" fill="#0f172a"/><text x="36" y="52" fill="#f8fafc" font-family="sans-serif" font-size="27">Prove the failed layer</text><rect x="36" y="82" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="113" fill="#7dd3fc" font-family="sans-serif" font-size="22">1. Name and destination</text><text x="56" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="17">Check DNS result, IP family and intended endpoint.</text><path d="M450 176 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="199" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="22">2. Reachability and policy</text><text x="56" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="17">Inspect route associations, SG and both NACL directions.</text><path d="M450 293 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="316" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="22">3. Transport and encryption</text><text x="56" y="375" fill="#e2e8f0" font-family="sans-serif" font-size="17">Test listener, TCP/QUIC handshake and TLS certificate.</text><path d="M450 410 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="433" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="464" fill="#7dd3fc" font-family="sans-serif" font-size="22">4. Application evidence</text><text x="56" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="17">Inspect health checks, access logs and request errors.</text></svg>