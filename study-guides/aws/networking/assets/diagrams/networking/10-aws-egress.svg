<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">Public NAT gateway IPv4 egress</title><desc id="desc">Private workload: Private subnet default route points to public NAT gateway.; Public NAT gateway: Translates source to its private IPv4 address / mapped port.; Internet gateway: Maps NAT private address to its associated Elastic IP.; Internet destination: Response returns through IGW and NAT mapping to workload.</desc><rect width="900" height="580" rx="24" fill="#0f172a"/><text x="36" y="52" fill="#f8fafc" font-family="sans-serif" font-size="27">Public NAT gateway IPv4 egress</text><rect x="36" y="82" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="113" fill="#7dd3fc" font-family="sans-serif" font-size="22">1. Private workload</text><text x="56" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="17">Private subnet default route points to public NAT gateway.</text><path d="M450 176 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="199" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="22">2. Public NAT gateway</text><text x="56" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="17">Translates source to its private IPv4 address / mapped port.</text><path d="M450 293 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="316" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="22">3. Internet gateway</text><text x="56" y="375" fill="#e2e8f0" font-family="sans-serif" font-size="17">Maps NAT private address to its associated Elastic IP.</text><path d="M450 410 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="433" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="464" fill="#7dd3fc" font-family="sans-serif" font-size="22">4. Internet destination</text><text x="56" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="17">Response returns through IGW and NAT mapping to workload.</text></svg>