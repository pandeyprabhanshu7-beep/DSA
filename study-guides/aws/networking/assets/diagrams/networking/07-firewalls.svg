<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">Controls at different scopes</title><desc id="desc">Subnet boundary: NACL: stateless allow/deny; check both directions.; Resource interface: Security group: stateful allow rules.; HTTP service: WAF examines supported HTTP request properties.; Application: Authentication and authorization still decide access.</desc><rect width="900" height="580" rx="24" fill="#0f172a"/><text x="36" y="52" fill="#f8fafc" font-family="sans-serif" font-size="27">Controls at different scopes</text><rect x="36" y="82" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="113" fill="#7dd3fc" font-family="sans-serif" font-size="22">1. Subnet boundary</text><text x="56" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="17">NACL: stateless allow/deny; check both directions.</text><path d="M450 176 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="199" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="22">2. Resource interface</text><text x="56" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="17">Security group: stateful allow rules.</text><path d="M450 293 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="316" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="22">3. HTTP service</text><text x="56" y="375" fill="#e2e8f0" font-family="sans-serif" font-size="17">WAF examines supported HTTP request properties.</text><path d="M450 410 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="433" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="464" fill="#7dd3fc" font-family="sans-serif" font-size="22">4. Application</text><text x="56" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="17">Authentication and authorization still decide access.</text></svg>