<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">HTTPS timeline (TCP example)</title><desc id="desc">DNS: Resolve hostname; cache may avoid a network query.; TCP: SYN, SYN-ACK, ACK establish transport.; TLS: Negotiate keys and authenticate server certificate.; HTTP: Request and response use encrypted transport; HTTP/3 uses QUIC.</desc><rect width="900" height="580" rx="24" fill="#0f172a"/><text x="36" y="52" fill="#f8fafc" font-family="sans-serif" font-size="27">HTTPS timeline (TCP example)</text><rect x="36" y="82" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="113" fill="#7dd3fc" font-family="sans-serif" font-size="22">1. DNS</text><text x="56" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="17">Resolve hostname; cache may avoid a network query.</text><path d="M450 176 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="199" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="22">2. TCP</text><text x="56" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="17">SYN, SYN-ACK, ACK establish transport.</text><path d="M450 293 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="316" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="22">3. TLS</text><text x="56" y="375" fill="#e2e8f0" font-family="sans-serif" font-size="17">Negotiate keys and authenticate server certificate.</text><path d="M450 410 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="433" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="464" fill="#7dd3fc" font-family="sans-serif" font-size="22">4. HTTP</text><text x="56" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="17">Request and response use encrypted transport; HTTP/3 uses QUIC.</text></svg>