<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">AWS application ingress</title><desc id="desc">Client and public endpoint: DNS points to an Internet-facing ALB.; Public subnets: ALB receives allowed HTTPS traffic via Internet connectivity.; Private application subnet: ALB initiates a separate connection to healthy targets.; Private database subnet: Application initiates permitted database traffic.</desc><rect width="900" height="580" rx="24" fill="#0f172a"/><text x="36" y="52" fill="#f8fafc" font-family="sans-serif" font-size="27">AWS application ingress</text><rect x="36" y="82" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="113" fill="#7dd3fc" font-family="sans-serif" font-size="22">1. Client and public endpoint</text><text x="56" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="17">DNS points to an Internet-facing ALB.</text><path d="M450 176 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="199" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="22">2. Public subnets</text><text x="56" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="17">ALB receives allowed HTTPS traffic via Internet connectivity.</text><path d="M450 293 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="316" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="22">3. Private application subnet</text><text x="56" y="375" fill="#e2e8f0" font-family="sans-serif" font-size="17">ALB initiates a separate connection to healthy targets.</text><path d="M450 410 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="433" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="464" fill="#7dd3fc" font-family="sans-serif" font-size="22">4. Private database subnet</text><text x="56" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="17">Application initiates permitted database traffic.</text></svg>