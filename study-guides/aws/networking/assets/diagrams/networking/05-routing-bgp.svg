<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">Routing: control plane and data plane</title><desc id="desc">Autonomous systems: Operators manage their own routing policy.; BGP control plane: Advertises reachability and path attributes between peers.; Local forwarding table: Selected routes program next hops; longest prefix wins.; IP data plane: Packets follow installed routes, not a BGP session per request.</desc><rect width="900" height="580" rx="24" fill="#0f172a"/><text x="36" y="52" fill="#f8fafc" font-family="sans-serif" font-size="27">Routing: control plane and data plane</text><rect x="36" y="82" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="113" fill="#7dd3fc" font-family="sans-serif" font-size="22">1. Autonomous systems</text><text x="56" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="17">Operators manage their own routing policy.</text><path d="M450 176 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="199" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="22">2. BGP control plane</text><text x="56" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="17">Advertises reachability and path attributes between peers.</text><path d="M450 293 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="316" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="22">3. Local forwarding table</text><text x="56" y="375" fill="#e2e8f0" font-family="sans-serif" font-size="17">Selected routes program next hops; longest prefix wins.</text><path d="M450 410 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="433" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="464" fill="#7dd3fc" font-family="sans-serif" font-size="22">4. IP data plane</text><text x="56" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="17">Packets follow installed routes, not a BGP session per request.</text></svg>