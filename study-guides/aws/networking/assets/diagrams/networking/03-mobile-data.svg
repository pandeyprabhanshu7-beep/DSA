<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">Cellular access and Internet</title><desc id="desc">Phone: Radio connection to base station; app sends IP traffic.; Radio access network: Carries user traffic into the operator network.; Operator user plane: UPF in 5G / gateway in 4G forwards; NAT may occur.; Internet service: IPv4 or IPv6 destination serves the application.</desc><rect width="900" height="580" rx="24" fill="#0f172a"/><text x="36" y="52" fill="#f8fafc" font-family="sans-serif" font-size="27">Cellular access and Internet</text><rect x="36" y="82" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="113" fill="#7dd3fc" font-family="sans-serif" font-size="22">1. Phone</text><text x="56" y="141" fill="#e2e8f0" font-family="sans-serif" font-size="17">Radio connection to base station; app sends IP traffic.</text><path d="M450 176 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="199" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="22">2. Radio access network</text><text x="56" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="17">Carries user traffic into the operator network.</text><path d="M450 293 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="316" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="22">3. Operator user plane</text><text x="56" y="375" fill="#e2e8f0" font-family="sans-serif" font-size="17">UPF in 5G / gateway in 4G forwards; NAT may occur.</text><path d="M450 410 v16 m-6 -6 l6 6 l6 -6" fill="none" stroke="#38bdf8" stroke-width="3"/><rect x="36" y="433" width="828" height="91" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="56" y="464" fill="#7dd3fc" font-family="sans-serif" font-size="22">4. Internet service</text><text x="56" y="492" fill="#e2e8f0" font-family="sans-serif" font-size="17">IPv4 or IPv6 destination serves the application.</text></svg>