const markdown="# Striver / Take U Forward — Graph DSA Deep Study Guide\n\n## Navigation and Index\n\n> Use this as the home page for the book. Every card ends with a return link.\n\n| ID | Topic | Jump |\n|---|---|---|\n| **G-1** | Introduction to Graph — Types & Conventions | [Jump](#g-1-introduction-to-graph-types-and-conventions) |\n| **G-2** | Graph Representation — Adjacency Matrix vs List | [Jump](#g-2-graph-representation-adjacency-matrix-vs-list) |\n| **G-3** | Java Graph Representation | [Jump](#g-3-java-graph-representation) |\n| **G-4** | Connected Components — Core Idea | [Jump](#g-4-connected-components-core-idea) |\n| **G-5** | Breadth-First Search | [Jump](#g-5-breadth-first-search) |\n| **G-6** | Depth-First Search | [Jump](#g-6-depth-first-search) |\n| **G-7** | Number of Provinces | [Jump](#g-7-number-of-provinces) |\n| **G-8** | Number of Islands | [Jump](#g-8-number-of-islands) |\n| **G-9** | Flood Fill | [Jump](#g-9-flood-fill) |\n| **G-10** | Rotten Oranges | [Jump](#g-10-rotten-oranges) |\n| **G-11** | Undirected Cycle Detection — BFS | [Jump](#g-11-undirected-cycle-detection-bfs) |\n| **G-12** | Undirected Cycle Detection — DFS | [Jump](#g-12-undirected-cycle-detection-dfs) |\n| **G-13** | Distance to Nearest 1 — Multi-Source BFS | [Jump](#g-13-distance-to-nearest-1-multi-source-bfs) |\n| **G-14** | Surrounded Regions | [Jump](#g-14-surrounded-regions) |\n| **G-15** | Number of Enclaves | [Jump](#g-15-number-of-enclaves) |\n| **G-16** | Number of Distinct Islands | [Jump](#g-16-number-of-distinct-islands) |\n| **G-17** | Bipartite Graph — BFS | [Jump](#g-17-bipartite-graph-bfs) |\n| **G-18** | Bipartite Graph — DFS | [Jump](#g-18-bipartite-graph-dfs) |\n| **G-19** | Directed Cycle Detection — DFS State | [Jump](#g-19-directed-cycle-detection-dfs-state) |\n| **G-20** | Eventual Safe States — DFS | [Jump](#g-20-eventual-safe-states-dfs) |\n| **G-21** | Topological Sort — DFS | [Jump](#g-21-topological-sort-dfs) |\n| **G-22** | Topological Sort ng-tree-theory) |\n| **G-45** | Prim Algorithm | [Jump](#g-45-prim-algorithm) |\n| **G-46** | Disjoint Set Union | [Jump](#g-46-disjoint-set-union) |\n| **G-47** | Kruskal Algorithm | [Jump](#g-47-kruskal-algorithm) |\n| **G-48** | Number of Provinces — DSU | [Jump](#g-48-number-of-provinces-dsu) |\n| **G-49** | Make Network Connected | [Jump](#g-49-make-network-connected) |\n| **G-50** | Accounts Merge | [Jump](#g-50-accounts-merge) |\n| **G-51** | Number of Islands II | [Jump](#g-51-number-of-islands-ii) |\n| **G-52** | Making a Large Island | [Jump](#g-52-making-a-large-island) |\n| **G-53** | Most Stones Removed | [Jump](#g-53-most-stones-removed) |\n| **G-54** | Kosaraju — Strongly Connected Components | [Jump](#g-54-kosaraju-strongly-connected-components) |\n| **G-55** | Bridges / Critical Connections — Tarjan Low-Link | [Jump](#g-55-bridges-critical-connections-tarjan-low-link) |\n| **G-56** | Articulation Points | [Jump](#g-56-articulation-points) |\n\n## How to study this book\n\nBefore naming an algorithm write five lines: NODE, EDGE, DIRECTION, COST, GOAL. Many graph bugs are modeling errors. Only after the model is explicit should you choose traversal, ordering, shortest-path, MST/DSU, SCC or low-link machinery.\n\n**Required reading order:** requirement → examples → data picture → brute force → repeated-work diagnosis → invariant → optimized plan → dry run → Java → correctness → boundaries → complexity → memory trick → variations.\n\n> **Source transparency:** topic ordering follows the retained Striver/Take U Forward study structure from this project. Extra examples, memory tricks, research notes and explanations are study-guide additions unless explicitly marked as verified from a creator/source.\n\n## Pattern recognition cheat sheet\n\n| Clue | Think about first |\n|---|---|\n| next/previous greater/smaller | monotonic stack |\n| fixed-size best window | deque / sliding window |\n| shortest unweighted path | BFS |\n| nonnegative weighted shortest path | Dijkstra |\n| negative edges | Bellman-Ford |\n| dependencies | topological sort |\n| repeated component merges | DSU |\n| critical edge/vertex | low-link DFS |\n| linked-list middle/cycle | slow/fast pointers |\n| tree child summaries | postorder DP |\n| repeated lookup/count | HashMap / HashSet |\n| subarray sum/count with negatives | prefix state + HashMap |\n\n<a id=\"g-1-introduction-to-graph-types-and-conventions\"></a>\n## G-1. Introduction to Graph — Types & Conventions\n\n[Index](#navigation-and-index) · [G-2 →](#g-2-graph-representation-adjacency-matrix-vs-list)\n\n### Detailed question understanding\n\nBefore selecting BFS, Dijkstra, DSU, or any other algorithm, translate the statement into a **graph contract**:\n\n| Contract field | Question that must have one explicit answer |\n|---|---|\n| vertices | What is one vertex, how many exist, and are labels `0..V-1`, `1..V`, strings, or objects? |\n| edges | What relationship creates an edge, and may a self-loop or a parallel edge exist? |\n| direction | Is `(u,v)` ordered (`u → v`) or unordered (`u — v`)? |\n| weight | Is there a cost/capacity/probability? Is weight `0` different from “no edge”? |\n| scope | Must every component be processed, or only vertices reachable from a given start? |\n| goal | Reachability, ordering, shortest path, minimum connection cost, or something else? |\n\nThis guide and the executable companion use vertices `0..V-1`. Their model permits self-loops and parallel edges only when the `GraphSpec` says so, stores weights as `long`, and never silently assumes that the graph is connected.\n\n> **KEY INTUITION — MODEL FIRST; ALGORITHM SECOND.** A fast algorithm over the wrong direction, label domain, or edge policy is still wrong.\n\n**Verified source note (accessed 2026-11-25).** NIST defines a graph as a vertex set plus an edge relation and distinguishes ordered directed edges from unordered undirected edges. Princeton's current `Graph` and `Digraph` APIs number vertices `0..V-1`, permit parallel edges and self-loops, and count an undirected self-loop twice in its vertex degree. Take U Forward's current introduction likewise separates directed, undirected, weighted, and unweighted models. The four examples, explicit contract, diagrams, Java implementation, validation rules, and proofs below are study-guide additions.\n\n### Four requirement-clarifying examples\n\n| # | Input contract | Derived state | Lesson |\n|---:|---|---|---|\n| 1 | undirected, `V=3`, edges `0—1, 1—2` | degree `[1,2,1]`; sum `4 = 2E` | one undirected edge contributes at both endpoints |\n| 2 | directed, `V=3`, edges `0→1, 1→2` | indegree `[0,1,1]`; outdegree `[1,1,0]` | reversing an edge changes the model and often the answer |\n| 3 | weighted directed, `V=4`, edges `(0,1,0)`, `(1,2,7)` | vertex `3` is isolated; `0→1` exists with weight zero | “no edge” needs a separate representation from weight `0` |\n| 4 | undirected multigraph, `V=2`, edges `0—1`, `0—1`, `1—1` | degree `[2,4]`; adjacency has six arcs | parallel edges stay distinct; a self-loop contributes two to degree |\n\n### One edge list, two different graphs\n\n```mermaid\nflowchart TB\n    E[\"pairs: (0,1), (1,2)\"]\n    E --> U[\"undirected: 0 — 1 — 2\"]\n    E --> D[\"directed: 0 → 1 → 2\"]\n    U --> UD[\"degree = [1,2,1]\"]\n    D --> DD[\"in = [0,1,1]; out = [1,1,0]\"]\n```\n\nThe input numbers alone do not determine direction. A problem statement, API contract, or schema must do that.\n\n### Model-first decision flow\n\n```mermaid\nflowchart TD\n    A[\"Name vertices and label domain\"] --> B[\"Define edge and direction\"]\n    B --> C[\"Define weight / absence semantics\"]\n    C --> D[\"Choose loop and parallel-edge policy\"]\n    D --> E[\"State component scope and goal\"]\n    E --> F[\"Only now select representation and algorithm\"]\n```\n\n### Detailed build trace\n\nBuild Example 4 as an undirected adjacency list. Each undirected edge creates two stored arcs, including a self-loop.\n\n| Step | source edge | adjacency after insertion | degree |\n|---:|---|---|---|\n| 0 | — | `0: []`, `1: []` | `[0,0]` |\n| 1 | edge 0: `0—1` | `0: [(1,e0)]`, `1: [(0,e0)]` | `[1,1]` |\n| 2 | edge 1: `0—1` | `0: [(1,e0),(1,e1)]`, `1: [(0,e0),(0,e1)]` | `[2,2]` |\n| 3 | edge 2: `1—1` | vertex `1` receives `(1,e2)` twice | `[2,4]` |\n\nThe edge ID matters: if an algorithm later skips “the parent vertex” rather than the exact parent **edge**, it can mishandle parallel edges. The same identity convention is used in the bridge and articulation-point cards.\n\n### Java — validated graph contract and adjacency builder\n\nThe repository companion [`GraphModelContracts.java`](../java/GraphModelContracts.java) contains the full executable checks. The core builder is:\n\n```java\nstatic BuiltGraph build(GraphSpec spec, List<Edge> edges) {\n    Objects.requireNonNull(spec, \"spec\");\n    Objects.requireNonNull(edges, \"edges\");\n    if (spec.vertices() < 0) throw new IllegalArgumentException(\"negative V\");\n\n    List<List<Arc>> adjacency = new ArrayList<>(spec.vertices());\n    for (int v = 0; v < spec.vertices(); v++) adjacency.add(new ArrayList<>());\n    int[] indegree = new int[spec.vertices()];\n    int[] outdegree = new int[spec.vertices()];\n    int[] degree = new int[spec.vertices()];\n    Set<Long> seen = new HashSet<>();\n\n    for (int edgeId = 0; edgeId < edges.size(); edgeId++) {\n        Edge edge = Objects.requireNonNull(edges.get(edgeId), \"null edge\");\n        validateVertex(edge.from(), spec.vertices());\n        validateVertex(edge.to(), spec.vertices());\n        if (edge.from() == edge.to() && !spec.allowSelfLoops())\n            throw new IllegalArgumentException(\"self-loop rejected\");\n\n        long key = edgeKey(edge.from(), edge.to(), spec.direction());\n        if (!spec.allowParallelEdges() && !seen.add(key))\n            throw new IllegalArgumentException(\"parallel edge rejected\");\n\n        adjacency.get(edge.from()).add(new Arc(edge.to(), edge.weight(), edgeId));\n        if (spec.direction() == Direction.DIRECTED) {\n            outdegree[edge.from()]++;\n            indegree[edge.to()]++;\n        } else {\n            adjacency.get(edge.to()).add(new Arc(edge.from(), edge.weight(), edgeId));\n            degree[edge.from()]++;\n            degree[edge.to()]++; // same cell increments twice for a self-loop\n        }\n    }\n    return freeze(spec, adjacency, indegree, outdegree, degree, edges.size());\n}\n```\n\nThe key correctness line for an undirected graph is the second adjacency insertion. Without it, a traversal started at `v` could not follow an edge supplied as `(u,v)` back to `u`; the representation would accidentally become directed.\n\n### Correctness argument\n\nMaintain this loop invariant after processing the first `k` source edges:\n\n1. every processed directed edge has exactly one adjacency arc, from its source to its destination;\n2. every processed undirected edge has exactly two adjacency arcs with the same edge ID, one per orientation—even for a self-loop;\n3. each degree array equals the number of incident processed edge ends under that graph's convention; and\n4. no unprocessed edge appears.\n\nThe invariant is true before the loop because all lists and counts are empty. One legal directed insertion adds exactly its source arc and increments exactly one outdegree and one indegree. One legal undirected insertion adds both orientations and increments both endpoints; when the endpoints are equal, the same cell is intentionally incremented twice. No other state changes, so the invariant is preserved. At termination `k=E`, the representation and degree summaries describe exactly the entire input edge multiset.\n\n### Boundary conditions and contract failures\n\n- `V=0` is a legal empty graph only when the edge list is empty.\n- Reject endpoints outside `0..V-1`; do not “fix” one-based labels by guessing.\n- Preserve an isolated vertex with an empty adjacency list.\n- Decide whether self-loops and parallel edges are legal before building. A **simple graph** rejects both; a multigraph may keep them.\n- Preserve zero and negative weights as data. Whether an algorithm supports them is a later choice (for example, ordinary Dijkstra does not support negative edges).\n- Store an edge ID when edge identity matters; endpoint pairs alone cannot distinguish parallel edges.\n- A disconnected graph requires a traversal start from every unvisited vertex when the goal covers the whole graph.\n\n### Complexity — derive it from stored arcs\n\nValidation plus construction takes **O(V+E)** expected time with the hash-set duplicate check. Space is **O(V+E)**: `V` adjacency buckets and either `E` directed arcs or `2E` undirected arcs, plus degree arrays and at most `E` duplicate keys. Iterating one adjacency bucket costs time proportional to its stored degree/outdegree; traversing all buckets visits every stored arc once.\n\nThere is no dynamic-programming memoization here. The adjacency list is the normalized reusable model that prevents every later algorithm from repeatedly rescanning the raw edge list.\n\n### Primary references\n\n- [NIST Dictionary of Algorithms and Data Structures — graph](https://xlinux.nist.gov/dads/HTML/graph.html)\n- [NIST DADS — directed graph](https://xlinux.nist.gov/dads/HTML/directedGraph.html)\n- [Princeton Algorithms 4/e — undirected `Graph`](https://algs4.cs.princeton.edu/code/javadoc/edu/princeton/cs/algs4/Graph.html)\n- [Princeton Algorithms 4/e — `Digraph`](https://algs4.cs.princeton.edu/code/javadoc/edu/princeton/cs/algs4/Digraph.html)\n- [Take U Forward — Introduction to Graph](https://takeuforward.org/blogs/data-structure-and-algorithm/introduction-to-graph)\n\n> **MEMORY TRICK — V-E-D-W-S-G:** vertices, edges, direction, weight, scope, goal.\n\n### Interview follow-ups and variations\n\n1. How would one-based or string labels be normalized without losing the original identity?\n2. When is an adjacency matrix preferable despite `O(V²)` space?\n3. How do parallel edges change bridge detection, minimum spanning trees, or edge removal?\n4. Which shortest-path algorithms remain valid after adding zero or negative weights?\n5. How would immutable, streaming, or dynamically deleted edges change ownership and representation?\n\n[↑ Back to Index](#navigation-and-index)\n\n---\n\n<a id=\"g-2-graph-representation-adjacency-matrix-vs-list\"></a>\n## G-2. Graph Representation — Adjacency Matrix vs List\n\n[← G-1](#g-1-introduction-to-graph-types-and-conventions) · [Index](#navigation-and-index) · [G-3 →](#g-3-java-graph-representation)\n\n### Detailed question understanding\n\nThe same graph contract can have several physical representations. Choose by the operations and density the problem actually needs—not by habit.\n\n| Requirement | Adjacency matrix | Adjacency list |\n|---|---|---|\n| stored state | one cell for every ordered vertex pair | one bucket per vertex plus real outgoing arcs |\n| space | `Θ(V²)` | `Θ(V+E)` |\n| test whether `u→v` exists | `Θ(1)` | `Θ(outdegree(u))` with a plain list |\n| iterate neighbors of `u` | `Θ(V)` row scan | `Θ(outdegree(u))` |\n| initialize/build | `Θ(V²+E)` | `Θ(V+E)` |\n| natural fit | dense graphs; many arbitrary edge-existence queries | sparse graphs; traversals and edge scans |\n\nThese costs assume a boolean matrix and a plain list. A bit matrix changes constants; a per-vertex hash set gives expected constant-time membership but uses more memory; weighted or parallel edges require richer cell/bucket values.\n\n> **KEY INTUITION — STORE WHAT THE NEXT OPERATION MUST ENUMERATE.** Traversals enumerate real neighbors, so sparse graphs usually want adjacency lists. Constant-time arbitrary pair queries may justify a matrix.\n\n**Verified source note (accessed 2026-11-25).** Princeton Algorithms 4/e presents a vertex-indexed adjacency-list `Graph` and a separate boolean-matrix implementation; its list representation uses `Θ(V+E)` space, while the matrix has one boolean per pair. Oracle's Java 21 `ArrayList` contract gives constant-time `get` and amortized constant-time `add`, supporting the list-build accounting used here. The bounded Take U Forward lesson explicitly compares the two representations and requires both orientations for an undirected edge. The examples, parity contract, diagrams, Java oracle and proofs below are study-guide additions.\n\n### Four requirement-clarifying examples\n\n| # | Graph contract | Matrix observation | List observation |\n|---:|---|---|---|\n| 1 | undirected `V=4`, edges `0—1, 0—2, 1—2`; vertex `3` isolated | symmetric `1` cells; row 3 all false | `[[1,2],[0,2],[0,1],[]]` |\n| 2 | directed `V=3`, edges `0→1, 1→2` | `M[0][1]` and `M[1][2]` only | `[[1],[2],[]]` |\n| 3 | complete undirected `K4` | 16 cells represent 6 edges; row scan cost 4 | 12 stored arcs; every list length 3 |\n| 4 | weighted parallel edges `(0,1,7)` and `(0,1,3)` | one boolean loses weight/identity; a cost matrix must define aggregation such as `min` | two `Arc` records preserve both edge IDs and weights |\n\n### Sparse versus dense storage picture\n\n```mermaid\nflowchart LR\n    S[\"Sparse: V=6, E=4\"] --> SM[\"matrix: 36 cells\"]\n    S --> SL[\"list: 6 buckets + 8 undirected arcs\"]\n    D[\"Dense K6: E=15\"] --> DM[\"matrix: 36 cells\"]\n    D --> DL[\"list: 6 buckets + 30 undirected arcs\"]\n```\n\nDo not compare only `E` with `V²`: the matrix is simple and predictable, while the list exposes only real neighbors. The required operations decide whether that memory trade is worthwhile.\n\n### Detailed build trace\n\nBuild Example 1 from the edge stream. The matrix and list must answer the same simple-graph membership queries after every step.\n\n| Step | input edge | new matrix cells | adjacency buckets | parity check |\n|---:|---|---|---|---|\n| 0 | — | all false | `[[],[],[],[]]` | every pair absent |\n| 1 | `0—1` | `[0][1]`, `[1][0]` | `[[1],[0],[],[]]` | `has(0,1)=has(1,0)=true` |\n| 2 | `0—2` | `[0][2]`, `[2][0]` | `[[1,2],[0],[0],[]]` | row 0 and bucket 0 both expose `{1,2}` |\n| 3 | `1—2` | `[1][2]`, `[2][1]` | `[[1,2],[0,2],[0,1],[]]` | all 16 pair queries agree |\n\nVertex `3` is never mentioned by an edge, yet both representations retain it: an all-false row and an empty bucket.\n\n### Representation selection flow\n\n```mermaid\nflowchart TD\n    A[\"Exact contract: simple, weighted, or multigraph?\"] --> B{\"Enumerate real neighbors often?\"}\n    B -->|yes| L[\"adjacency list\"]\n    B -->|no| C{\"Many arbitrary pair queries and V² fits?\"}\n    C -->|yes| M[\"adjacency matrix / bit matrix\"]\n    C -->|no| H[\"list plus set/index, chosen from measured operations\"]\n```\n\n### Java — build both and cross-check the contract\n\nThe full executable companion is [`GraphRepresentationContracts.java`](../java/GraphRepresentationContracts.java). It models a **simple unweighted graph**: duplicate input edges are idempotent, and both representations expose the same membership and neighbor sets.\n\n```java\nstatic Pair buildBoth(int vertices, boolean directed, List<Edge> edges) {\n    validateVertexCount(vertices);\n    boolean[][] matrix = new boolean[vertices][vertices];\n    List<Set<Integer>> sets = new ArrayList<>(vertices);\n    for (int u = 0; u < vertices; u++) sets.add(new LinkedHashSet<>());\n\n    for (Edge edge : edges) {\n        validateVertex(edge.from(), vertices);\n        validateVertex(edge.to(), vertices);\n        matrix[edge.from()][edge.to()] = true;\n        sets.get(edge.from()).add(edge.to());\n\n        if (!directed) {\n            matrix[edge.to()][edge.from()] = true;\n            sets.get(edge.to()).add(edge.from());\n        }\n    }\n\n    List<List<Integer>> adjacency = sets.stream()\n            .map(set -> List.copyOf(set))\n            .toList();\n    return new Pair(new MatrixGraph(matrix), new ListGraph(adjacency));\n}\n```\n\nFor a production multigraph, do **not** use this boolean/idempotent contract. Store an `Arc(to, weight, edgeId)` per occurrence as G‑1 does, or define exactly what a matrix cell aggregates.\n\n### Correctness argument\n\nAfter processing the first `k` input edges, maintain:\n\n1. `matrix[u][v]` is true iff at least one processed edge permits `u→v`;\n2. list bucket `u` contains `v` iff that same permitted relation exists; and\n3. every vertex has one row and one bucket, even if isolated.\n\nAll cells and buckets are empty initially, so the invariant holds. A directed edge sets and inserts exactly `(u,v)`. An undirected edge additionally sets and inserts `(v,u)`. Set insertion makes duplicates idempotent in both representations. No unrelated pair changes, so the invariant is preserved. At termination, every pair query and neighbor set therefore agrees.\n\n### Complexity — include initialization, not only edge insertion\n\n- **Matrix:** allocating/clearing `V×V` cells costs `Θ(V²)` time and space; processing the edge stream adds `Θ(E)` time. One membership query is `Θ(1)` and a neighbor scan is `Θ(V)`.\n- **List:** creating `V` buckets and inserting the arcs costs expected `Θ(V+E)` with hash-backed deduplication in this companion; the final plain lists use `Θ(V+E)` space. Plain-list membership is `Θ(degree(u))`; neighbor iteration is `Θ(degree(u))`.\n- **Undirected storage:** a non-loop edge appears in both endpoint buckets. A self-loop may appear once or twice depending on the declared degree/iteration contract; G‑1 uses the Princeton convention of two stored arcs.\n\nNo memoization is involved. Representation is preprocessing: pay once to make later membership or neighbor operations match the algorithm's access pattern.\n\n### Boundary conditions and failure modes\n\n- Keep all `V` rows/buckets, including isolated vertices.\n- Reject labels outside `0..V-1`; never infer one-based conversion.\n- A boolean matrix collapses parallel edges and cannot preserve edge identity.\n- A numeric matrix needs a separate absence sentinel; weight `0` may be a real edge.\n- `V²` can overflow an `int` capacity calculation before allocation; check using `long` and a memory budget.\n- For immutable consumers, freeze buckets so callers cannot corrupt shared graph state.\n- Matrix/list iteration order is not a graph property; sort only when the required output order demands it.\n\n### Primary references\n\n- [Princeton Algorithms 4/e — Undirected Graphs and representations](https://algs4.cs.princeton.edu/41graph/)\n- [Princeton Algorithms 4/e — adjacency-matrix implementation](https://algs4.cs.princeton.edu/41graph/AdjMatrixGraph.java.html)\n- [Princeton Algorithms 4/e — adjacency-list `Graph`](https://algs4.cs.princeton.edu/code/javadoc/edu/princeton/cs/algs4/Graph.html)\n- [Oracle Java 21 — `ArrayList`](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html)\n- [Take U Forward — Graph representation in C++ lesson](https://takeuforward.org/graph/graph-representation-in-c)\n\n> **MEMORY TRICK — MATRIX SCANS POSSIBILITIES; LIST SCANS REALITY.**\n\n### Interview follow-ups and variations\n\n1. What changes for a bit-packed matrix, a per-vertex hash set, or compressed sparse row (CSR)?\n2. How should a matrix cell represent the lightest of several parallel weighted edges?\n3. Which representation supports dynamic insertion/deletion with the required latency?\n4. When can `Θ(V²)` memory still be faster in practice because of locality and bit operations?\n5. How would you preserve deterministic neighbor order without making every insertion expensive?\n\n[↑ Back to Index](#navigation-and-index)\n\n---\n\n<a id=\"g-3-java-graph-representation\"></a>\n## G-3. Java Graph Representation\n\n[← G-2](#g-2-graph-representation-adjacency-matrix-vs-list) · [Index](#navigation-and-index) · [G-4 →](#g-4-connected-components-core-idea)\n\n### Detailed question understanding\n\nBuild a Java adjacency list from a declared vertex count and edge stream. The contract must say whether the graph is directed, whether weights and parallel edges matter, and who may mutate the result.\n\nThis card assumes vertices `0..V-1`, preserves every input edge occurrence, assigns its input index as `edgeId`, and stores `Arc(to, weight, edgeId)`. For an undirected graph, every input edge creates two oriented arcs—even a self-loop. That convention makes degree equal the bucket size and retains edge identity for later low-link or removal algorithms.\n\n> **KEY INTUITION — AN ADJACENCY LIST IS AN OWNED, TYPED INDEX OVER THE EDGE STREAM.** Keep empty buckets for isolated vertices, retain the fields future algorithms need, and freeze the finished structure when callers should only read it.\n\n**Verified source note (accessed 2026-11-25).** Princeton Algorithms 4/e models an undirected graph as a vertex-indexed array of adjacency bags, permits parallel edges and self-loops, and stores a self-loop twice. Oracle Java 21 documents amortized constant-time `ArrayList.add`; `List.copyOf` creates an unmodifiable snapshot in encounter order. The bounded Take U Forward lesson requires Java adjacency lists for weighted and unweighted input. The typed ownership contract, diagrams, traces, proofs and executable oracle below are study-guide additions.\n\n### Four requirement-clarifying examples\n\n| # | Input / setup | Output / observation | Why it matters |\n|---:|---|---|---|\n| 1 | undirected `V=4`, `(0,1,4)`, `(0,2,7)` | `adj[0]=[(1,4,#0),(2,7,#1)]`; `adj[3]=[]` | reverse arcs plus isolated bucket |\n| 2 | directed `V=3`, `(0,1,5)`, `(1,2,-2)` | only `0→1` and `1→2`; negative weight is preserved | direction and data are representation facts |\n| 3 | undirected parallel edges `(0,1,9)`, `(0,1,3)` | both buckets retain edge IDs `#0` and `#1` | endpoint pairs alone are not edge identity |\n| 4 | undirected self-loop `(1,1,6)` | bucket 1 contains two arcs with edge ID `#0` | degree contribution is two under this convention |\n\n### Java ownership model\n\n```mermaid\nflowchart TD\n    E[\"InputEdge(from, to, weight)\"] --> B[\"validate endpoints\"]\n    B --> F[\"append forward Arc\"]\n    F --> D{\"directed?\"}\n    D -->|yes| Z[\"freeze every bucket\"]\n    D -->|no| R[\"append reverse Arc\"]\n    R --> Z\n```\n\nUse a typed record instead of `int[]`: `arc.to()` and `arc.weight()` cannot be accidentally swapped. Build with mutable `ArrayList` buckets, then snapshot every inner list and the outer list. Returning only an unmodifiable outer list is insufficient because callers could still mutate its buckets.\n\n### Detailed build trace\n\nTrace Example 1. The input position becomes the stable edge ID.\n\n| Step | input | mutation | adjacency after step |\n|---:|---|---|---|\n| 0 | — | allocate four buckets | `[[],[],[],[]]` |\n| 1a | edge `#0=(0,1,4)` | append forward `(1,4,#0)` to bucket 0 | `[[(1,4,#0)],[],[],[]]` |\n| 1b | undirected reverse | append `(0,4,#0)` to bucket 1 | `[[(1,4,#0)],[(0,4,#0)],[],[]]` |\n| 2a | edge `#1=(0,2,7)` | append forward `(2,7,#1)` to bucket 0 | `[[(1,4,#0),(2,7,#1)],[(0,4,#0)],[],[]]` |\n| 2b | undirected reverse | append `(0,7,#1)` to bucket 2, then freeze | `[[(1,4,#0),(2,7,#1)],[(0,4,#0)],[(0,7,#1)],[]]` |\n\nVertex `3` survives because buckets are allocated from `V`, not discovered from edges.\n\n### Java — typed, immutable adjacency list\n\nThe full executable companion is [`GraphAdjacencyListContracts.java`](../java/GraphAdjacencyListContracts.java).\n\n```java\nrecord InputEdge(int from, int to, long weight) {}\nrecord Arc(int to, long weight, int edgeId) {}\n\nstatic Graph build(int vertices, boolean directed, List<InputEdge> edges) {\n    if (vertices < 0) throw new IllegalArgumentException(\"negative V\");\n    Objects.requireNonNull(edges, \"edges\");\n\n    List<List<Arc>> mutable = new ArrayList<>(vertices);\n    for (int v = 0; v < vertices; v++) mutable.add(new ArrayList<>());\n\n    for (int edgeId = 0; edgeId < edges.size(); edgeId++) {\n        InputEdge edge = Objects.requireNonNull(edges.get(edgeId), \"null edge\");\n        validateVertex(edge.from(), vertices);\n        validateVertex(edge.to(), vertices);\n        mutable.get(edge.from()).add(new Arc(edge.to(), edge.weight(), edgeId));\n        if (!directed) {\n            mutable.get(edge.to()).add(new Arc(edge.from(), edge.weight(), edgeId));\n        }\n    }\n\n    List<List<Arc>> frozen = mutable.stream().map(List::copyOf).toList();\n    return new Graph(vertices, directed, edges.size(), frozen);\n}\n```\n\nThe returned `Graph` owns an immutable snapshot of the adjacency structure. `long weight` prevents representation-level truncation; whether a later algorithm accepts negative weights is a separate algorithm contract.\n\n### Correctness argument\n\nAfter processing the first `k` input edges:\n\n1. every vertex owns exactly one bucket, including isolated vertices;\n2. for each processed edge `i=(u,v,w)`, bucket `u` contains exactly one arc `(v,w,i)`;\n3. if the graph is undirected, bucket `v` additionally contains exactly one arc `(u,w,i)`; and\n4. no arc refers to an unprocessed edge ID.\n\nThe invariant is true for `k=0` because all `V` buckets are empty. Processing edge `k` validates both endpoints, appends exactly its required forward arc and, only for an undirected graph, its required reverse arc. No earlier bucket entry changes. Therefore the invariant holds for `k+1`; at `k=E`, the adjacency list represents the complete input multiset. Freezing copies changes mutability, not content.\n\n### Complexity and ownership costs\n\nCreating `V` buckets costs `Θ(V)`. Each directed input creates one arc; each undirected input creates two, so construction and freezing cost `Θ(V+E)` time and space. Iterating bucket `u` costs `Θ(outdegree(u))` for directed graphs or `Θ(degree(u))` under the declared undirected convention. `ArrayList.add` is amortized `O(1)`; freezing is deliberately linear because it establishes ownership.\n\nThere is no memoization: the representation is a reusable index that prevents later algorithms from rescanning all `E` raw edges to discover one vertex's neighbors.\n\n### Boundary conditions and contract failures\n\n- `V=0` is valid only with an empty edge list; any endpoint is out of range.\n- Reject negative `V`, null edge lists, null edge records and endpoints outside `0..V-1`.\n- Do not discard negative or zero weights at representation time.\n- Preserve parallel edges when edge multiplicity or identity can matter.\n- Decide the self-loop convention explicitly; this card stores two arcs for an undirected loop.\n- `List.copyOf` is shallow: using immutable `Arc` records makes that sufficient here.\n- Encounter order is deterministic in this builder but is not an intrinsic graph property.\n- For concurrent mutation, publish a new immutable graph snapshot or add explicit synchronization; fail-fast iterators are not a correctness mechanism.\n\n### Primary references\n\n- [Oracle Java 21 — `ArrayList`](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html)\n- [Oracle Java 21 — `List.copyOf`](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/List.html#copyOf(java.util.Collection))\n- [Oracle Java 21 — records](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Record.html)\n- [Princeton Algorithms 4/e — adjacency-list `Graph`](https://algs4.cs.princeton.edu/code/javadoc/edu/princeton/cs/algs4/Graph.html)\n- [Take U Forward — Graph representation in Java](https://takeuforward.org/graph/graph-representation-in-java)\n\n> **MEMORY TRICK — ALLOCATE, VALIDATE, EXPAND, FREEZE.**\n\n### Interview follow-ups and variations\n\n1. When is `List<List<Integer>>` sufficient, and when is an `Arc` record required?\n2. How would a simple-graph contract reject or deduplicate parallel edges?\n3. What changes if vertices use strings or sparse external IDs?\n4. How would compressed sparse row trade build cost for locality and lower overhead?\n5. How would dynamic insertion/deletion change the immutable ownership design?\n\n[↑ Back to Index](#navigation-and-index)\n\n---\n\n<a id=\"g-4-connected-components-core-idea\"></a>\n## G-4. Connected Components — Core Idea\n\n[← G-3](#g-3-java-graph-representation) · [Index](#navigation-and-index) · [G-5 →](#g-5-breadth-first-search)\n\n### Detailed question understanding\n\nGiven an **undirected** graph with vertices `0..V-1`, partition every vertex into its maximal connected component. Return a dense component ID for each vertex and, when requested, the component members.\n\nA traversal from one root reaches exactly that root's component—not the whole graph. Therefore the essential structure is an outer loop over every vertex plus one BFS/DFS from each still-unassigned vertex.\n\n> **KEY INTUITION — ONE NEW ROOT MEANS ONE NEW COMPONENT.** Mark a vertex when it enters the queue so cycles, self-loops and parallel edges cannot enqueue it repeatedly.\n\n**Verified source note (accessed 2026-11-26).** NIST defines connected components as maximal connected subgraphs that partition the vertices. Princeton Algorithms 4/e exposes dense component IDs `0..k-1`, connectivity and count queries, and gives `Θ(V+E)` preprocessing with `Θ(V)` extra space. Oracle Java 21 documents amortized constant-time deque operations used by the iterative BFS. The deterministic ID contract, traces, Java implementation, diagrams and independent union-find oracle below are study-guide additions.\n\n### Four requirement-clarifying examples\n\n| # | Input / setup | Output / observation | Why it matters |\n|---:|---|---|---|\n| 1 | `V=6`, edges `0—1, 1—2, 3—4` | members `[[0,1,2],[3,4],[5]]`, IDs `[0,0,0,1,1,2]` | disconnected graph plus isolated vertex |\n| 2 | `V=3`, triangle `0—1—2—0` | one component | cycles do not create extra components |\n| 3 | `V=3`, no edges | three singleton components | every vertex must be an outer-loop candidate |\n| 4 | `V=2`, loop `0—0` and two copies of `0—1` | one component | loops/parallel edges do not change reachability |\n\nComponent IDs here are deterministic: scan roots in ascending vertex order, and assign the next ID to the first unassigned root. Member order is BFS encounter order and depends on adjacency order; connectivity does not.\n\n### Why one start is insufficient\n\n```mermaid\nflowchart TD\n    O[\"scan vertex v = 0..V-1\"] --> A{\"already assigned?\"}\n    A -->|yes| O\n    A -->|no| N[\"create next component ID\"]\n    N --> B[\"BFS from v; assign every reached vertex\"]\n    B --> O\n```\n\nThe outer loop supplies completeness across components. The inner traversal supplies closure within one component.\n\n### Detailed trace — Example 1\n\n| Step | outer/root or queue action | queue | component IDs | members completed/in progress |\n|---:|---|---|---|---|\n| 0 | initialize | `[]` | `[-1,-1,-1,-1,-1,-1]` | `[]` |\n| 1 | root `0` → ID `0` | `[0]` | `[0,-1,-1,-1,-1,-1]` | `[0]` |\n| 2 | pop `0`, accept `1` | `[1]` | `[0,0,-1,-1,-1,-1]` | `[0,1]` |\n| 3 | pop `1`, reject seen `0`, accept `2` | `[2]` | `[0,0,0,-1,-1,-1]` | `[0,1,2]` |\n| 4 | root `3` → ID `1`, then accept `4` | `[4]` | `[0,0,0,1,1,-1]` | `[[0,1,2],[3,4]]` |\n| 5 | root `5` → ID `2` | `[5]` | `[0,0,0,1,1,2]` | `[[0,1,2],[3,4],[5]]` |\n\n### Java — outer loop plus iterative BFS\n\nThe full executable companion is [`GraphComponentsContracts.java`](../java/GraphComponentsContracts.java).\n\n```java\nstatic Components findComponents(int vertices, List<Edge> edges) {\n    List<List<Integer>> graph = buildUndirected(vertices, edges);\n    int[] id = new int[vertices];\n    Arrays.fill(id, -1);\n    List<List<Integer>> members = new ArrayList<>();\n\n    for (int root = 0; root < vertices; root++) {\n        if (id[root] != -1) continue;\n        int component = members.size();\n        List<Integer> current = new ArrayList<>();\n        Deque<Integer> queue = new ArrayDeque<>();\n        id[root] = component;              // mark when enqueued\n        queue.addLast(root);\n\n        while (!queue.isEmpty()) {\n            int vertex = queue.removeFirst();\n            current.add(vertex);\n            for (int next : graph.get(vertex)) {\n                if (id[next] == -1) {\n                    id[next] = component;  // prevents duplicate enqueue\n                    queue.addLast(next);\n                }\n            }\n        }\n        members.add(List.copyOf(current));\n    }\n    return freezeResult(id, members);\n}\n```\n\n### Correctness argument\n\nBefore each outer-loop iteration at vertex `v`, every earlier vertex is assigned to exactly its true connected component, and every assigned component is complete. If `v` is already assigned, it belongs to one of those complete components. Otherwise `v` is the smallest vertex in a not-yet-discovered component.\n\nThe BFS invariant is: queued or processed vertices are exactly the discovered vertices reachable from the root, all have the new component ID, and no vertex is enqueued twice. Mark-on-enqueue preserves uniqueness. Every accepted neighbor is reachable; conversely, along any path from the root, induction on path length ensures the next vertex is eventually accepted. Thus BFS assigns exactly the root's maximal connected component. When the outer loop ends, every vertex has been considered, so the returned components are disjoint and cover all vertices.\n\n### Complexity — count vertices and stored arcs\n\nBuilding the undirected adjacency list costs `Θ(V+E)` time and space. Each vertex is enqueued once, and each of the `2E` stored arcs is inspected once, so component discovery is `Θ(V+E)` time with `Θ(V)` auxiliary queue/ID space. Returning all members uses `Θ(V)` output space. After preprocessing, checking whether two vertices share an ID is `O(1)`.\n\nThe `id` array is the reusable solved-state table: it prevents repeated traversal of an already classified component.\n\n### Boundary conditions and contract failures\n\n- `V=0` returns zero components and empty outputs.\n- With `V>0` and no edges, return `V` singleton components.\n- Reject null edges, null edge records and endpoints outside `0..V-1`.\n- Self-loops and parallel edges do not alter the partition; visited state absorbs them safely.\n- This contract is for **undirected** connectivity. Directed graphs require weak components (ignore direction) or strongly connected components—state which one.\n- Recursive DFS may overflow the call stack on a long chain; iterative BFS/DFS avoids that risk.\n- Mark when enqueueing/pushing, not when removing, to bound duplicate frontier entries.\n\n### Primary references\n\n- [NIST DADS — connected components](https://xlinux.nist.gov/dads/HTML/connectedComponents.html)\n- [Princeton Algorithms 4/e — connected-components API](https://algs4.cs.princeton.edu/code/javadoc/edu/princeton/cs/algs4/CC.html)\n- [Princeton Algorithms 4/e — undirected graph applications](https://algs4.cs.princeton.edu/41graph/)\n- [Oracle Java 21 — `ArrayDeque`](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayDeque.html)\n- [Take U Forward — Connected components](https://takeuforward.org/graph/connected-components-in-graphs)\n\n> **MEMORY TRICK — OUTER LOOP FINDS ROOTS; INNER LOOP CLOSES COMPONENTS.**\n\n### Interview follow-ups and variations\n\n1. How would you return only the component count, sizes, or largest component?\n2. When is union-find preferable to traversal for incremental edge additions?\n3. How do weak and strong components differ for directed graphs?\n4. How would a grid's four- versus eight-neighbor rule change the components?\n5. Can component IDs remain stable after dynamic edge insertion or deletion?\n\n[↑ Back to Index](#navigation-and-index)\n\n---\n\n<a id=\"g-5-breadth-first-search\"></a>\n## G-5. Breadth-First Search\n\n[← G-4](#g-4-connected-components-core-idea) · [Index](#navigation-and-index) · [G-6 →](#g-6-depth-first-search)\n\n### Detailed question understanding\n\nGiven a directed or undirected adjacency list and a valid source, return the vertices reachable from that source in breadth-first order. This contract also returns minimum **edge-count** distance and one parent certificate per reached vertex.\n\nBFS explores a frontier in nondecreasing distance layers. Traversal order within a layer depends on adjacency encounter order; it is not a unique graph property.\n\n> **KEY INTUITION — THE QUEUE HOLDS THE NEXT DISTANCE FRONTIER.** Mark when enqueueing, not when dequeueing, so each vertex enters the queue once and its first parent already proves a shortest path.\n\n**Verified source note (accessed 2026-11-26).** Princeton Algorithms 4/e proves that BFS computes shortest paths by number of edges and runs in `Θ(V+E)` worst-case time. Oracle Java 21 documents amortized constant-time `ArrayDeque` operations. The bounded Take U Forward lesson stresses adjacency-order output and mark-on-enqueue. The distance/parent contract, traces, diagrams, validation and executable all-pairs oracle below are study-guide additions.\n\n### Four requirement-clarifying examples\n\n| # | Input / setup | Output / observation | Why it matters |\n|---:|---|---|---|\n| 1 | edges `0→1,0→2,1→3,2→4`, source `0` | order `[0,1,2,3,4]`, distances `[0,1,1,2,2]` | canonical layers |\n| 2 | same graph, source `3` | order `[3]`; others distance `-1` | source-scoped traversal |\n| 3 | adjacency of `0` changed from `[1,2]` to `[2,1]` | order begins `[0,2,1,…]`; distances unchanged | order is representation-dependent |\n| 4 | cycle `0→1→2→0` plus two copies of `0→1` | each vertex appears once | mark-on-enqueue absorbs cycles/duplicates |\n\n### Queue and layer model\n\n```mermaid\nflowchart LR\n    L0[\"distance 0: source\"] --> L1[\"distance 1: source neighbors\"]\n    L1 --> L2[\"distance 2: first unseen neighbors\"]\n    L2 --> LX[\"continue until queue empty\"]\n```\n\n### Detailed trace — Example 1\n\n| Step | remove | newly enqueue | queue after step | order | distances fixed |\n|---:|---:|---|---|---|---|\n| 0 | — | `0` | `[0]` | `[]` | `d[0]=0` |\n| 1 | `0` | `1,2` | `[1,2]` | `[0]` | `d[1]=d[2]=1` |\n| 2 | `1` | `3` | `[2,3]` | `[0,1]` | `d[3]=2` |\n| 3 | `2` | `4` | `[3,4]` | `[0,1,2]` | `d[4]=2` |\n| 4–5 | `3,4` | — | `[]` | `[0,1,2,3,4]` | final |\n\nIf marking were delayed until removal, the same vertex could be enqueued by multiple parents. The distances might survive, but queue size and chosen parent would no longer obey this contract.\n\n### Java — traversal, distance and parent certificate\n\nThe full executable companion is [`GraphBfsContracts.java`](../java/GraphBfsContracts.java).\n\n```java\nstatic BfsResult bfs(List<List<Integer>> graph, int source) {\n    int[] distance = new int[graph.size()];\n    int[] parent = new int[graph.size()];\n    Arrays.fill(distance, -1);\n    Arrays.fill(parent, -1);\n    Deque<Integer> queue = new ArrayDeque<>();\n    List<Integer> order = new ArrayList<>();\n\n    distance[source] = 0;\n    queue.addLast(source);\n    while (!queue.isEmpty()) {\n        int vertex = queue.removeFirst();\n        order.add(vertex);\n        for (int next : graph.get(vertex)) {\n            if (distance[next] == -1) {\n                distance[next] = distance[vertex] + 1;\n                parent[next] = vertex;\n                queue.addLast(next);\n            }\n        }\n    }\n    return freeze(order, distance, parent);\n}\n```\n\n### Correctness argument\n\nMaintain that every queued vertex is reached, has its minimum edge-count distance fixed, and appears in the queue exactly once; queue order is nondecreasing by distance. This is true initially for the source. When removing a vertex at distance `d`, every unseen neighbor receives distance `d+1`. Any path to that neighbor must first reach some predecessor; because BFS removes all layers below `d+1` first, no shorter path can appear later. Mark-on-enqueue prevents a second insertion. When the queue empties, precisely the reachable vertices have finite distance, and following parent links decreases distance by one until the source.\n\n### Complexity and boundaries\n\nEach reached vertex enters and leaves the queue once, and each outgoing arc of a reached vertex is inspected once: `O(V+E)` worst-case time and `O(V)` auxiliary/output state. `ArrayDeque` endpoint operations are amortized `O(1)`.\n\n- Reject null graphs, null buckets, invalid neighbor labels and an invalid source.\n- An empty graph has no valid source; a singleton returns `[0]` from source `0`.\n- Unreachable vertices retain distance and parent `-1`.\n- BFS minimizes edge count, not weighted cost; use an appropriate shortest-path algorithm for weights.\n- To traverse every component, use the G-4 outer-loop pattern; do not silently change a source-scoped contract.\n- Parent choice and within-layer order depend on adjacency order.\n\n### Primary references\n\n- [Princeton Algorithms 4/e — undirected graphs and BFS proposition](https://algs4.cs.princeton.edu/41graph/)\n- [Oracle Java 21 — `ArrayDeque`](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayDeque.html)\n- [Take U Forward — Breadth-first search](https://takeuforward.org/graph/breadth-first-search-bfs-level-order-traversal)\n\n> **MEMORY TRICK — ENQUEUE ONCE; DISTANCE IS DONE.**\n\n### Interview follow-ups and variations\n\n1. How do you reconstruct one shortest path from the parent array?\n2. What changes for multi-source BFS?\n3. Why does ordinary BFS fail for arbitrary positive weights?\n4. When can bidirectional BFS reduce explored state?\n5. How do adjacency sorting costs affect deterministic output?\n\n[↑ Back to Index](#navigation-and-index)\n\n---\n\n<a id=\"g-6-depth-first-search\"></a>\n## G-6. Depth-First Search\n\n[← G-5](#g-5-breadth-first-search) · [Index](#navigation-and-index) · [G-7 →](#g-7-number-of-provinces)\n\n### Detailed question understanding\n\nGiven a validated adjacency list and source `s`, return the **DFS preorder of exactly the vertices reachable from `s`**, following each adjacency bucket in stored order. Retain the first-discovery parent of every reached non-source vertex as a DFS-tree certificate.\n\nThis is source-scoped traversal, not a whole-graph forest. Unreachable vertices do not appear. Output is deterministic only relative to the supplied adjacency order; DFS promises neither lexicographically smallest order nor a shortest path.\n\n> **KEY INTUITION — CLAIM, DESCEND, RESUME.** Claim a vertex before following any edge, fully explore the first unseen neighbor, then resume the suspended parent at its next neighbor.\n\n**Verified source note (accessed 2026-11-26).** The selected verified Graph guide and four earlier workbooks agree on mark-before-recursing, adjacency-order preorder and `O(V+E)` traversal. One older Markdown workbook accidentally commented out its `seen[u] = true` statement; the canonical code below does not copy that defect. Princeton Algorithms 4/e states that DFS marks source-reachable vertices and first-discovery edges form a parent-link tree. Oracle Java 21 recommends `Deque` instead of legacy `Stack` for LIFO work. The explicit frame machine, validation, examples, proof and executable oracle suite below are study-guide additions.\n\n### Four requirement-clarifying examples\n\n| # | Input / setup | DFS preorder from source | Why it matters |\n|---:|---|---|---|\n| 1 | undirected buckets `[[1,2],[0,3],[0,4],[1],[2]]`, `s=0` | `[0,1,3,2,4]` | canonical adjacency-order traversal |\n| 2 | three isolated vertices, `s=2` | `[2]` | traversal is source-scoped |\n| 3 | Example 1 but bucket `0=[2,1]` | `[0,2,4,1,3]` | neighbor order changes a valid DFS preorder |\n| 4 | buckets `[[0,1,1],[0,2],[1]]`, `s=0` | `[0,1,2]` | loops, parallel edges and a cycle still visit once |\n\nThe same implementation handles directed or undirected buckets. Direction is already encoded by the adjacency list; traversal must not invent reverse edges.\n\n### Recursive meaning and explicit frames\n\n```mermaid\nflowchart TD\n    A[\"claim source; emit preorder\"] --> B{\"top frame has next neighbor?\"}\n    B -->|no| C[\"pop finished frame\"]\n    C --> B\n    B -->|yes| D[\"advance parent cursor\"]\n    D --> E{\"neighbor already seen?\"}\n    E -->|yes| B\n    E -->|no| F[\"claim child; set parent; emit\"]\n    F --> G[\"push child frame\"]\n    G --> B\n```\n\nA frame `(vertex, nextNeighborIndex)` is a suspended recursive call: earlier neighbors were examined and the indexed neighbor is next. It preserves recursive adjacency order without using the JVM call stack.\n\nA shorter iterative variant pushes every neighbor onto a vertex stack. It must push in reverse order to imitate recursive preorder, and duplicate pending vertices complicate its state. Frames encode the recursive control state directly and keep at most one live frame per reached vertex.\n\n### Exact frame trace for Example 1\n\nFrame notation is `vertex:nextIndex`; the active frame is leftmost.\n\n| Step | stack before | inspected edge / action | order | parent update |\n|---:|---|---|---|---|\n| 0 | `[]` | claim `0`; push `0:0` | `[0]` | — |\n| 1 | `[0:0]` | `0→1` unseen; claim/push `1` | `[0,1]` | `parent[1]=0` |\n| 2 | `[1:0,0:1]` | `1→0` already seen | `[0,1]` | — |\n| 3 | `[1:1,0:1]` | `1→3` unseen; claim/push `3` | `[0,1,3]` | `parent[3]=1` |\n| 4 | `[3:0,1:2,0:1]` | skip `3→1`; finish `3`, then `1` | `[0,1,3]` | — |\n| 5 | `[0:1]` | `0→2` unseen; claim/push `2` | `[0,1,3,2]` | `parent[2]=0` |\n| 6 | `[2:0,0:2]` | skip `2→0`; take `2→4`; finish | `[0,1,3,2,4]` | `parent[4]=2` |\n\nThe parent certificate is `[-1,0,0,1,2]`. Following parents from a reached vertex ends at source `0`, but that tree path is not promised shortest.\n\n### Java — iterative preorder with exact recursion frames\n\nThe complete executable companion is [`GraphDfsContracts.java`](../java/GraphDfsContracts.java).\n\n```java\nstatic Result dfs(int source, List<List<Integer>> graph) {\n    validate(graph);\n    if (source < 0 || source >= graph.size())\n        throw new IllegalArgumentException(\"source outside 0..V-1\");\n\n    boolean[] seen = new boolean[graph.size()];\n    int[] parent = new int[graph.size()];\n    Arrays.fill(parent, -1);\n    List<Integer> order = new ArrayList<>();\n    Deque<Frame> stack = new ArrayDeque<>();\n\n    seen[source] = true;\n    order.add(source);\n    stack.push(new Frame(source));\n\n    while (!stack.isEmpty()) {\n        Frame frame = stack.peek();\n        List<Integer> neighbors = graph.get(frame.vertex);\n        if (frame.nextNeighbor == neighbors.size()) {\n            stack.pop();\n            continue;\n        }\n        int neighbor = neighbors.get(frame.nextNeighbor++);\n        if (seen[neighbor]) continue;\n\n        seen[neighbor] = true;\n        parent[neighbor] = frame.vertex;\n        order.add(neighbor);\n        stack.push(new Frame(neighbor));\n    }\n    return immutableResult(order, parent);\n}\n```\n\nThe pivotal order is: advance the parent cursor, mark the child, record parent/preorder, then push the child frame. Marking after the push would allow a cycle edge to rediscover an active vertex.\n\n### Correctness argument\n\nAt every loop header:\n\n1. `seen[v]` is true exactly for vertices already emitted in `order`;\n2. each seen non-source vertex has one first-discovery parent edge from an earlier emitted vertex;\n3. the stack, bottom to top, is the current DFS-tree path; and\n4. each frame cursor separates examined neighbors from neighbors still to examine.\n\nInitially only the source is seen/emitted and its frame cursor is zero. Popping an exhausted frame returns to its parent without changing reachability state. Skipping a seen neighbor records that edge as examined without duplicating a visit. For an unseen neighbor, claiming/emitting it, recording the discovery edge and pushing a zero-cursor frame is exactly the next recursive DFS call. The invariant is preserved.\n\nWhen the stack empties, every edge leaving every seen vertex was examined. If a reachable vertex were unseen, the first source-path edge from a seen tail to an unseen head would have claimed its head—a contradiction. Thus the output contains every and only source-reachable vertex, once, in recursive adjacency-order preorder.\n\n### Complexity and stack-safety boundary\n\nValidation scans all `V` buckets and stored entries. DFS emits each reachable vertex once and examines each outgoing entry of every reached vertex once: `Θ(V+E)` worst-case time for a validated graph, `Θ(V)` visited/parent/frame state, plus output. An undirected logical edge normally contributes two adjacency entries, still `Θ(E)`.\n\nThe explicit deque prevents call-stack overflow on a long chain; the companion verifies a 50,000-vertex chain. It does **not** make memory constant: depth `V` still needs `Θ(V)` frames. Recursive DFS is appropriate only when maximum depth is safely bounded.\n\n### Boundary conditions and contract failures\n\n- Reject null graphs, buckets or neighbors, invalid endpoints, and a source outside `0..V-1` before traversal.\n- An empty graph has no valid source; an API that returns empty without a source is a different contract.\n- Mark on discovery before descending; marking on return can recurse forever around a cycle.\n- Self-loops and parallel edges are legal when the graph model permits them; `seen` preserves uniqueness.\n- Unreachable vertices and the source both have parent `-1`; membership in `order` distinguishes them.\n- DFS finds a path, not an unweighted shortest path; use BFS when minimum edge count is required.\n- Mutation during traversal invalidates frame cursors. Traverse an immutable snapshot or synchronize explicitly.\n- Whole-graph DFS needs an outer loop that starts a new root after each component; that is a different result.\n\n### Primary references\n\n- [Princeton Algorithms 4/e — undirected graphs and DFS propositions](https://algs4.cs.princeton.edu/41graph/)\n- [Princeton Algorithms 4/e — `DepthFirstSearch`](https://algs4.cs.princeton.edu/code/javadoc/edu/princeton/cs/algs4/DepthFirstSearch.html)\n- [Oracle Java 21 — `Deque` as a LIFO stack](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Deque.html)\n- [Take U Forward — Depth-first search](https://takeuforward.org/graph/depth-first-search-dfs)\n\n> **MEMORY TRICK — CLAIM, DESCEND, RESUME.**\n\n### Interview follow-ups and variations\n\n1. How do you return a whole DFS forest for a disconnected graph?\n2. Why can two valid DFS orders differ on the same abstract graph?\n3. How would discovery and finish timestamps classify edges?\n4. When is reverse-neighbor push equivalent to frame-based DFS?\n5. Which later algorithms need active-path state in addition to ordinary `seen`?\n\n[↑ Back to Index](#navigation-and-index)\n\n---\n\n<a id=\"g-7-number-of-provinces\"></a>\n## G-7. Number of Provinces\n\n[← G-6](#g-6-depth-first-search) · [Index](#navigation-and-index) · [G-8 →](#g-8-number-of-islands)\n\n### Detailed question understanding\n\n**What is the problem/lesson asking?** Number of Provinces. Rewrite the exact input state, legal operation/relationship, and requested output before choosing a technique. Similar titles often hide materially different variants—for example nearest greater versus count of all greater values, four-direction versus eight-direction grid adjacency, or node identity versus equal node values.\n\n### Three requirement-clarifying examples\n\n| # | Input / setup | Output / observation | Why it matters |\n|---:|---|---|---|\n| 1 | `smallest valid input` | `trace base state` | base/boundary semantics |\n| 2 | `typical nontrivial input` | `trace expected result` | core invariant |\n| 3 | `boundary-shaped input` | `verify edge behavior` | protect implementation |\n\n### Pattern recognition\n\n**Primary pattern:** Graph modeling\n\n> **KEY INTUITION —** Write NODE, EDGE, DIRECTION, COST and GOAL before naming an algorithm.\n\n### Brute-force / straightforward baseline\n\nStart with the direct simulation/repeated scan that mirrors the statement. It is valuable because it exposes **what is being recomputed**. Then ask: *what exact fact from earlier work would make the next decision immediate?*\n\n### Optimized reasoning\n\nName the invariant before code. The optimized solution for this family is derived from the intuition above. Every state change must preserve the invariant; if you cannot say what the working structure means after processing the first *i* items/nodes/states, the implementation is not ready.\n\n### Detailed dry run\n\nWrite frontier, current node, neighbor/edge considered, and every visited/dist/color/indegree/low change.\n\nFor interview practice, include at least four snapshots: initial state, first nontrivial state change, the state where the central invariant does real work, and final state. Explain **why each mutation occurred**, not merely what the values became.\n\n### Java implementation / template\n\n```java\n// Card-specific Java implementation is expanded during the scheduled deepening pass.\n// Interview discipline:\n// 1) define the state/invariant,\n// 2) implement exactly one valid transition,\n// 3) test empty/single/duplicate/extreme cases,\n// 4) use long for sums/distances when constraints can overflow int.\n```\n\n### Key line to highlight\n\nFind the line that changes the invariant: the monotonic `while`, a graph relaxation `if`, a pointer splice, a recursive return combination, or a HashMap lookup/update. Explain what would break if its comparison or ordering changed.\n\n### Correctness checklist\n\n1. State the invariant before the loop/recursion.\n2. Show it is true initially.\n3. Show every transition preserves it.\n4. Explain why the terminal state implies the requested answer.\n5. For greedy algorithms, identify the exchange/cut/monotonic argument that makes the local choice safe.\n\n### Boundary conditions\n\n- empty/null input when the platform permits it;\n- one element/node/state;\n- duplicates and strict-versus-nonstrict comparisons;\n- monotone/skewed/disconnected shape where relevant;\n- overflow cost\n```\n\n**Verified source note.** Take U Forward's current Dijkstra lesson states the same non-negative-weight requirement and uses a min-heap; its optimized version also skips outdated heap entries. CP-Algorithms likewise defines Dijkstra for non-negative edge weights. Extra proofs, dry runs, and Java engineering notes below are added study material.\n\n### Four requirement-clarifying examples\n\n| # | Graph / source | Result | What it teaches |\n|---:|---|---|---|\n| 1 | `0-1(4), 0-2(1), 2-1(2)`, source 0 | `[0,3,1]` | first discovery is not necessarily final; 1 improves from 4 to 3 |\n| 2 | `0-1(2), 1-2(3)` plus isolated 3 | `[0,2,5,INF]` | unreachable vertices remain unreachable |\n| 3 | parallel choices `0-1(10), 0-2(2), 2-1(2)` | `dist[1]=4` | relaxation replaces a worse tentative route |\n| 4 | `0→1(5), 0→2(2), 2→1(-4)` | **do not use Dijkstra** | negative edges break the greedy finalization argument |\n\n### Visual model\n\n```text\n          4\n      0 ------> 1\n       \\        ^\n      1 \\       | 2\n         v      |\n          2 ----+\n\nInitial: dist = [0, INF, INF], pq = [(0,0)]\nFrom 0 : dist = [0, 4, 1],   pq = [(1,2),(4,1)]\nFrom 2 : dist = [0, 3, 1],   pq = [(3,1),(4,1)]\nFrom 1 : settle distance 3\nLater  : (4,1) is stale → skip\n```\n\n### Pattern recognition\n\nThink **Dijkstra** when all of these are true:\n\n- the question asks for minimum/shortest accumulated cost;\n- edge costs are non-negative;\n- the graph is not a special easier case such as unit weight (BFS) or a DAG (topological relaxation);\n- one source or a small number of sources are involved.\n\nDo **not** reflexively use Dijkstra:\n\n| Situation | Better first thought |\n|---|---|\n| every edge has cost 1 | BFS |\n| costs are only 0 or 1 | 0-1 BFS |\n| DAG, even with negative edges | topological-order relaxation |\n| arbitrary negative edges | Bellman-Ford |\n| all-pairs shortest path, small dense graph | Floyd-Warshall |\n\n> **KEY INTUITION — CHEAPEST FRONTIER FIRST.**  \n> The priority queue does not mean “this vertex is permanently finished when first inserted.” It means “among all currently known routes, inspect the cheapest route next.”\n\n### Baseline: repeated minimum scan\n\nThe textbook baseline keeps `dist[]` and repeatedly scans all unprocessed vertices to find the minimum tentative distance.\n\n- minimum selection: `O(V)` each time;\n- repeated up to `V` times;\n- edge relaxation: `O(E)`.\n\nFor a dense graph this `O(V² + E)` approach can be reasonable, but on sparse graphs it repeatedly rescans vertices just to answer: **which tentative distance is smallest?**\n\nThe heap removes that repeated minimum scan.\n\n### Optimized invariant\n\n`dist[v]` = smallest source-to-`v` distance discovered so far.\n\nEvery heap entry `(d,v)` represents a discovered route of length `d`. Because Java's `PriorityQueue` has no decrease-key operation, a better route inserts a **new** pair. The old pair remains in the heap.\n\nTherefore this line matters:\n\n```java\nif (cur.d() != dist[cur.u()]) continue;\n```\n\nIt rejects an outdated route. Without it, correctness can still survive with non-negative weights if relaxations are guarded, but the same adjacency list can be scanned unnecessarily many times.\n\n### Detailed dry run\n\nGraph:\n\n```text\n0 --4--> 1 --1--> 3 --3--> 4\n \\       ^\n  1      |2\n   v     |\n    2 -- + \n    \\5------>3\n```\n\nEdges: `0→1(4), 0→2(1), 2→1(2), 1→3(1), 2→3(5), 3→4(3)`.\n\n| Step | pop | important relaxations | dist after step | heap after pushes |\n|---:|---|---|---|---|\n| 0 | — | initialize source | `[0,∞,∞,∞,∞]` | `(0,0)` |\n| 1 | `(0,0)` | 1←4, 2←1 | `[0,4,1,∞,∞]` | `(1,2),(4,1)` |\n| 2 | `(1,2)` | 1 improves 4→3; 3←6 | `[0,3,1,6,∞]` | `(3,1),(4,1),(6,3)` |\n| 3 | `(3,1)` | 3 improves 6→4 | `[0,3,1,4,∞]` | `(4,1),(4,3),(6,3)` |\n| 4 | `(4,1)` | stale: 4 != dist[1]=3 | unchanged | skip |\n| 5 | `(4,3)` | 4←7 | `[0,3,1,4,7]` | includes `(7,4)` |\n| 6 | `(6,3)` | stale: 6 != dist[3]=4 | unchanged | skip |\n| 7 | `(7,4)` | none | final `[0,3,1,4,7]` | empty |\n\nThe important observation is that **heap entries are routes, not unique vertices**.\n\n### Java implementation\n\n```java\nimport java.util.*;\n\nfinal class DijkstraGuide {\n    record Edge(int to, long weight) {}\n    record State(long distance, int node) {}\n\n    static long[] shortestPaths(List<List<Edge>> graph, int source) {\n        int n = graph.size();\n        long INF = Long.MAX_VALUE / 4;\n\n        long[] dist = new long[n];\n        Arrays.fill(dist, INF);\n        dist[source] = 0L;\n\n        PriorityQueue<State> pq =\n                new PriorityQueue<>(Comparator.comparingLong(State::distance));\n        pq.offer(new State(0L, source));\n\n        while (!pq.isEmpty()) {\n            State cur = pq.poll();\n\n            // Java PriorityQueue has no decrease-key: discard the old route.\n            if (cur.distance() != dist[cur.node()]) {\n                continue;\n            }\n\n            for (Edge edge : graph.get(cur.node())) {\n                // With INF chosen safely below Long.MAX_VALUE and cur reachable,\n                // this addition has headroom for normal interview constraints.\n                long candidate = cur.distance() + edge.weight();\n\n                if (candidate < dist[edge.to()]) {\n                    dist[edge.to()] = candidate;\n                    pq.offer(new State(candidate, edge.to()));\n                }\n            }\n        }\n        return dist;\n    }\n}\n```\n\n### Why Dijkstra is correct\n\n**Invariant.** When a non-stale pair `(d,u)` is the minimum heap entry, `d = dist[u]` is the true shortest distance to `u`.\n\nSuppose there were a shorter undiscovered path to `u`. Walk along that path from the source and find the first vertex `y` not yet reached with its final shortest distance; let `x` be its predecessor. The prefix to `x` has already been available for relaxation. Because the edge `x→y` is non-negative, the candidate for `y` cannot exceed the total hypothetical shorter path to `u`. That candidate would therefore have priority no worse than `u`, contradicting that `u` was the smallest valid heap state. The argument fails with negative edges because a later edge could reduce the path below a vertex already chosen greedily.\n\n### Complexity — derive it\n\nUsing adjacency lists and lazy heap updates:\n\n- every adjacency entry is examined when its source is processed from a valid state;\n- every successful relaxation can push one heap entry;\n- there are at most `O(E)` successful edge relaxations/pushes;\n- each heap push/pop costs `O(log E)`, commonly written `O(log V)` for standard simple-graph bounds.\n\nSo the usual bound is **`O((V+E) log V)`**, often simplified to **`O(E log V)`** for a connected graph. Storage is **`O(V+E)`** for graph, distance array, and heap entries.\n\n### Boundary conditions and common mistakes\n\n- **Negative edge:** switch algorithms; Dijkstra's proof no longer applies.\n- **Disconnected vertex:** leave as INF, then translate to `-1` only if required by the problem.\n- **Large path sums:** use `long`, not `int`.\n- **Stale heap entries:** skip them before scanning neighbors.\n- **Undirected graph:** add both directions; directed graph: add only the stated direction.\n- **Multiple equal shortest paths:** distance alone is unchanged; if the question asks for counts, maintain `ways[]`.\n- **Path reconstruction:** maintain `parent[v]=u` on a strict improvement.\n- **Early exit:** safe when the target is popped as the smallest **non-stale** state under Dijkstra's assumptions.\n\n### Memoization / repeated-work note\n\nThis is not recursive memoization, but `dist[]` is reusable solved-state knowledge: a relaxation is accepted only if it improves the best known state. The stale-entry check prevents obsolete routes from repeating adjacency work. For repeated shortest-path queries from the **same source**, cache the computed `dist[]`; for many different sources, reconsider whether an all-pairs strategy or preprocessing fits the constraints.\n\n> **MEMORY TRICK —** **POP CHEAPEST → SKIP STALE → RELAX NEIGHBORS.**\n\n### Interview follow-ups and variations\n\n1. Return the actual path: add a parent array and reverse the parent chain.\n2. Count shortest paths: keep `ways[v]`; replace on shorter distance, add on equal distance.\n3. Minimum-effort / minimax path: change the path-combine operation from sum to `max`.\n4. Multi-source Dijkstra: seed every source with distance 0.\n5. Why ordinary FIFO queue is insufficient: weighted discoveries are not ordered by total cost.\n6. Compare with BFS, 0-1 BFS, DAG relaxation, Bellman-Ford, and Floyd-Warshall.\n\n[↑ Back to Index](#navigation-and-index)\n\n---\n\n<a id=\"g-33-dijkstra-ordered-set-variant\"></a>\n## G-33. Dijkstra — Ordered Set Variant\n\n[← G-32](#g-32-dijkstra-priority-queue) · [Index](#navigation-and-index) · [G-34 →](#g-34-why-ordinary-queue-fails-for-weighted-shortest-path)\n\n### Detailed question understanding\n\n**What is the problem/lesson asking?** Dijkstra — Ordered Set Variant. Rewrite the exact input state, legal operation/relationship, and requested output before choosing a technique. Similar titles often hide materially different variants—for example nearest greater versus count of all greater values, four-direction versus eight-direction grid adjacency, or node identity versus equal node values.\n\n### Three requirement-clarifying examples\n\n| # | Input / setup | Output / observation | Why it matters |\n|---:|---|---|---|\n| 1 | `0→1(4),0→2(1),2→1(2)` | `dist(1)=3` | later relaxation improves |\n| 2 | `0-1(5),1-2(2)` | `[0,5,7]` | weighted chain |\n| 3 | `unreachable node` | `INF` | disconnected |\n\n### Pattern recognition\n\n**Primary pattern:** Best-first shortest path\n\n> **KEY INTUITION —** With non-negative/monotone path costs, always expand the smallest tentative state first.\n\n### Brute-force / straightforward baseline\n\nStart with the direct simulation  Back to Index](#navigation-and-index)\n\n---\n\n<a id=\"g-46-disjoint-set-union\"></a>\n## G-46. Disjoint Set Union (Union-Find)\n\n[← G-45](#g-45-prim-algorithm) · [Index](#navigation-and-index) · [G-47 →](#g-47-kruskal-algorithm)\n\n### Detailed question understanding\n\n**DSU is not a traversal algorithm.** It maintains a changing partition of elements into disjoint connected groups while supporting two questions efficiently:\n\n1. **FIND(x):** which component/set currently owns x?\n2. **UNION(a,b):** merge the components containing a and b.\n\nUse it when the story repeatedly says **connect, merge, same group, redundant edge, component size, dynamic island, account identity, or Kruskal**.\n\n```text\nSTATE = parent[] forest + size[] (or rank[])\nFIND  = representative/root of a component\nUNION = attach one representative tree below another\nGOAL  = answer connectivity/merge questions without re-traversing whole components\n```\n\n**Verified source note.** CP-Algorithms describes the same representative-tree model, path compression, union by size/rank, and the combined amortized `O(alpha(n))` complexity. The examples, Java engineering notes, dry run, and interview heuristics below are added study material.\n\n### Four clarifying examples\n\n| # | Operations | Result | What it teaches |\n|---:|---|---|---|\n| 1 | `union(0,1), union(1,2)` | `connected(0,2)=true` | connectivity is transitive |\n| 2 | sets `{0,1,2}`, `{3,4}`; `union(2,4)` | one set of size 5 | union must merge **roots**, not arbitrary nodes |\n| 3 | `union(0,1)` followed by `union(0,1)` | second union returns false/no structural change | same-root edge is redundant |\n| 4 | components `{0,1}`, `{2}`, `{3,4}` | 3 components | DSU can maintain component count incrementally |\n\n### Visual model\n\nBefore merging two components:\n\n```text\nComponent A             Component B\n    0                       3\n   / \\                      |\n  1   2                     4\nsize[0]=3               size[3]=2\n```\n\nUnion by size attaches the smaller root under the larger root:\n\n```text\n        0\n      / | \\\n     1  2  3\n           |\n           4\n\nparent[3] = 0\nsize[0]   = 5\n```\n\nAfter `find(4)`, path compression rewires 4 directly to the representative:\n\n```text\n        0\n     / / \\ \\\n    1 2   3 4\n```\n\n> **MEMORY TRICK — FIND COMPRESSES; UNION BALANCES.**\n\n### Why the naive approach repeats work\n\nSuppose each connectivity query runs DFS/BFS from `a` to see whether `b` is reachable. With many interleaved merges and queries, the same component may be traversed repeatedly.\n\nA naive parent forest is better, but arbitrary unions can create:\n\n```text\n0 <- 1 <- 2 <- 3 <- 4 <- 5\n```\n\nThen `find(5)` walks the whole chain: `O(n)`.\n\nDSU removes both forms of repeated work:\n\n- **union by size/rank** prevents tall trees from forming quickly;\n- **path compression** remembers the representative discovered by a find and rewires visited nodes to it.\n\nThis is the DSU equivalent of memoizing repeated ownership lookup.\n\n### Optimized invariant\n\nFor every element `x`:\n\n- repeatedly following `parent[x]` ends at a root `r`;\n- a root satisfies `parent[r] == r`;\n- two elements are in the same set **iff** their roots are equal;\n- `size[r]` is meaningful only when `r` is a current root.\n\nNever compare `parent[a] == parent[b]` as a substitute for `find(a) == find(b)`: two nodes can have different immediate parents but the same representative.\n\n### Detailed dry run\n\nStart with six isolated elements:\n\n```text\nparent = [0,1,2,3,4,5]\nsize   = [1,1,1,1,1,1]\ncomponents = 6\n```\n\n| Step | Operation | Roots before | Structural change | components |\n|---:|---|---|---|---:|\n| 1 | `union(0,1)` | 0,1 | 1→0; size[0]=2 | 5 |\n| 2 | `union(2,3)` | 2,3 | 3→2; size[2]=2 | 4 |\n| 3 | `union(3,4)` | find(3)=2, 4 | 4→2; size[2]=3 | 3 |\n| 4 | `union(1,4)` | find(1)=0, find(4)=2 | smaller root 0→2; size[2]=5 | 2 |\n| 5 | `find(1)` | path 1→0→2 | compress: parent[1]=2 | 2 |\n| 6 | `union(0,4)` | both root 2 | no merge; redundant | 2 |\n\nAfter step 5 a useful snapshot is:\n\n```text\nparent ≈ [2,2,2,2,2,5]\nroot 2 owns {0,1,2,3,4}; root 5 owns {5}\n```\n\nThe exact non-root parent layout can differ depending on earlier compression calls; **component membership must not depend on a particular internal tree shape**.\n\n### Java implementation — union by size + path compression\n\n```java\nfinal class DisjointSet {\n    private final int[] parent;\n    private final int[] size;\n    private int components;\n\n    DisjointSet(int n) {\n        if (n < 0) throw new IllegalArgumentException(\"n must be non-negative\");\n        parent = new int[n];\n        size = new int[n];\n        components = n;\n\n        for (int i = 0; i < n; i++) {\n            parent[i] = i;\n            size[i] = 1;\n        }\n    }\n\n    int find(int x) {\n        if (parent[x] != x) {\n            parent[x] = find(parent[x]); // path compression\n        }\n        return parent[x];\n    }\n\n    boolean union(int a, int b) {\n        int ra = find(a);\n        int rb = find(b);\n\n        if (ra == rb) return false;      // already connected\n\n        // Attach smaller component below larger component.\n        if (size[ra] < size[rb]) {\n            int tmp = ra;\n            ra = rb;\n            rb = tmp;\n        }\n\n        parent[rb] = ra;\n        size[ra] += size[rb];\n        components--;\n        return true;\n    }\n\n    boolean connected(int a, int b) {\n        return find(a) == find(b);\n    }\n\n    int componentSize(int x) {\n        return size[find(x)];\n    }\n\n    int componentCount() {\n        return components;\n    }\n}\n```\n\n### The two lines interviewers care about\n\n```java\nparent[x] = find(parent[x]);   // compress the path\nparent[smallerRoot] = largerRoot; // union by size/rank\n```\n\nThe first line turns information learned during a lookup into future speed. The second prevents a large tree from being unnecessarily placed below a small one.\n\n### Correctness reasoning\n\n**Claim 1 — find returns the component representative.** Initially each node is its own root. A union changes only one root's parent to another root, so parent links never connect two elements unless their sets are intentionally merged. Following parents therefore ends at the representative of exactly that merged set. Path compression changes intermediate parent pointers to the **same root**, so it preserves membership.\n\n**Claim 2 — union merges exactly two components.** If `find(a)==find(b)`, they already belong to one component and no change is required. Otherwise attaching one root beneath the other creates exactly one parent connection between the two previously disjoint trees. No third component is touched.\n\n**Claim 3 — union-by-size changes performance, not semantics.** Choosing which root becomes parent changes only tree shape; both sets still receive the same representative afterward.\n\n### Complexity — derive it instead of saying \"O(1)\"\n\nInitialization costs `O(n)` time and `O(n)` space.\n\nWith **both** path compression and union by size/rank, a sequence of `m` DSU operations costs `O(m alpha(n))` amortized, where `alpha` is the inverse Ackermann function and grows extraordinarily slowly. Treat this as practically constant for normal inputs, but in an interview say **amortized O(alpha(n))**, not literally O(1).\n\nUseful contrast:\n\n| Implementation | Typical bound |\n|---|---|\n| arbitrary parent attachment | find can degrade to `O(n)` |\n| union by size/rank, no path compression | `O(log n)` per operation |\n| size/rank + path compression | `O(alpha(n))` amortized |\n\n### Boundary conditions and common mistakes\n\n- `n=0`: constructor is valid, but no element index is valid.\n- `n=1`: find returns itself; self-union must not decrement component count.\n- Duplicate edges: `union` should return false when roots already match.\n- Always call `find` before merging; attaching `parent[b]=a` directly can corrupt balancing metadata.\n- Update `size[]` only for the surviving root.\n- Rank and size are different heuristics; do not increment \"rank\" as though it were component size.\n- Recursive find is concise; for extremely constrained stack environments an iterative compression variant may be preferred.\n- Standard DSU handles **merges**, not arbitrary online deletions/splits. Dynamic connectivity with deletions needs more advanced machinery or offline reversal techniques.\n\n### Pattern recognition map\n\n| Problem clue | DSU move |\n|---|---|\n| edge joins two previously separate components | `union(u,v)` |\n| \"are these connected?\" | compare roots |\n| redundant connection / cycle in undirected incremental graph | union fails because roots already equal |\n| Kruskal MST | accept edge iff union succeeds |\n| number of components | start at n, decrement on successful union |\n| largest merged group | maintain root size |\n| Accounts Merge | union account IDs sharing an email |\n| Number of Islands II | create/activate cells, union active neighbors |\n\n### Related variations\n\n1. **Union by rank** instead of size: same asymptotic performance.\n2. **Rollback DSU:** supports undo for offline divide-and-conquer connectivity; ordinary path compression is usually avoided because rollback must restore mutations.\n3. **Weighted/potential DSU:** stores relative information such as parity or distance-to-parent.\n4. **DSU on a grid:** flatten `(r,c)` to `r * cols + c`.\n5. **Kruskal:** sort edges by weight, union endpoints only when they are in different components.\n\n### Interview follow-ups\n\n1. Why is `parent[a] == parent[b]` insufficient for connectivity?\n2. What exact repeated work does path compression remove?\n3. Why does union by size prevent long chains?\n4. Can DSU detect a cycle in a directed graph? Standard DSU is naturally suited to undirected connectivity; directed cycles usually need DFS state or topological methods.\n5. Why is the complexity amortized rather than worst-case constant per call?\n6. How would you maintain component count and maximum component size?\n\n[↑ Back to Index](#navigation-and-index)\n\n---\n\n<a id=\"g-47-kruskal-algorithm\"></a>\n## G-47. Kruskal Algorithm\n\n[← G-46](#g-46-disjoint-set-union) · [Index](#navigation-and-index) · [G-48 →](#g-48-number-of-provinces-dsu)\n\n### Detailed question understanding\n\n**What is the problem/lesson asking?** Kruskal Algorithm. Rewrite the exact input state, legal operation/relationship, and requested output before choosing a technique. Similar titles often hide materially different variants—for example nearest greater versus count of all greater values, four-direction versus eight-direction grid adjacency, or node identity versus equal node values.\n\n### Three requirement-clarifying examples\n\n| # | Input / setup | Output / observation | Why it matters |\n|---:|---|---|---|\n| 1 | `smallest valid input` | `trace base state` | base/boundary semantics |\n| 2 | `typical nontrivial input` | `trace expected result` | core invariant |\n| 3 | `boundary-shaped input` | `verify edge behavior` | protect implementation |\n\n### Pattern recognition\n\n**Primary pattern:** MST cut reasoning\n\n> **KEY INTUITION —** Connect all vertices with minimum total edge weight; this is not the same objective as source shortest paths.\n\n### Brute-force / straightforward baseline\n\nStart with the direct simulation/repeated scan that mirrors the statement. It is valuable because it exposes **what is being recomputed**. Then ask: *what exact fact from earlier work would make the next decision immediate?*\n\n### Optimized reasoning\n\nName the invariant before code. The optimized solution for this family is derived from the intuition above. Every state change must preserve the invariant; if you cannot say what the working structure means after processing the first *i* items/nodes/states, the implementation is not ready.\n\n### Detailed dry r
